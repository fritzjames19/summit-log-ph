function buildAuthScene(){
  const W = 1600, H = 900;
  let seed = 20261015;
  const rnd = () => { seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  const mkNoise = () => { const p = Array.from({length:256}, rnd); return x => { const i = Math.floor(x), fr = x - i, t = fr*fr*(3-2*fr); const a = p[i & 255], b = p[(i+1) & 255]; return a + (b-a)*t; }; };
  const f = n => n.toFixed(1);

  // jagged, alpine-looking ridgeline: ridged fractal noise + a few hand-placed summits
  function ridge(o){
    const noise = mkNoise(), swell = mkNoise(), pts = [];
    for(let x = -20; x <= W + 20; x += 8){
      let v = 0, a = 1, fq = o.freq, norm = 0;
      for(let k = 0; k < o.oct; k++){ const n = noise(x*fq/100 + k*17.3 + o.off); v += a*(1 - Math.abs(2*n - 1)); norm += a; a *= 0.5; fq *= 2.15; }
      v /= norm;
      let h = o.amp * (0.55*v + 0.45*swell(x*o.swellFreq/100 + o.off*3));
      (o.peaks || []).forEach(p => { const d = Math.abs(x - p.x)/p.w; h += p.h*Math.exp(-Math.pow(d, 1.35)*1.7); });
      pts.push([x, o.base - h]);
    }
    return pts;
  }
  const area = pts => 'M' + f(pts[0][0]) + ',' + (H + 20) + pts.map(p => ' L' + f(p[0]) + ',' + f(p[1])).join('') + ' L' + f(pts[pts.length-1][0]) + ',' + (H + 20) + ' Z';
  const yAt = (pts, x) => { const i = Math.max(0, Math.min(pts.length - 2, Math.floor((x - pts[0][0]) / 8))); return pts[i][1] + (pts[i+1][1] - pts[i][1]) * (((x - pts[i][0]) / 8) % 1); };

  // snow caps: contiguous crest runs above the snow line, with a ragged lower edge
  function snow(pts, snowY, fill, jag){
    let out = '', run = [];
    const flush = () => {
      if(run.length > 2){
        let d = 'M' + f(run[0][0]) + ',' + f(run[0][1]);
        for(let i = 1; i < run.length; i++) d += ' L' + f(run[i][0]) + ',' + f(run[i][1]);
        for(let i = run.length - 1; i >= 0; i--){ const x = run[i][0]; const y = snowY + (i % 2 ? jag*rnd() : jag*0.3*rnd()) + 7*Math.sin(x*0.07); d += ' L' + f(x) + ',' + f(Math.max(y, run[i][1] + 3)); }
        out += '<path d="' + d + ' Z" fill="' + fill + '"/>';
      }
      run = [];
    };
    pts.forEach(p => { if(p[1] < snowY) run.push(p); else flush(); });
    flush();
    return out;
  }

  // shaded faces: slopes turned away from the low sun (right side of the sky) get a darker wedge
  function faces(pts, base, alpha){
    let out = '';
    for(let i = 2; i < pts.length - 2; i++){
      const p = pts[i];
      if(!(p[1] < pts[i-1][1] && p[1] < pts[i+1][1] && p[1] < pts[i-2][1] && p[1] < pts[i+2][1])) continue;
      let j = i; while(j > 0 && pts[j-1][1] >= pts[j][1] && i - j < 38) j--;
      if(i - j < 5) continue;
      const seg = pts.slice(j, i + 1);
      const tx = p[0] - (base - p[1]) * 0.38;
      out += '<path d="M' + seg.map(q => f(q[0]) + ',' + f(q[1])).join(' L') + ' L' + f(tx) + ',' + (base + 30) + ' L' + f(seg[0][0]) + ',' + (base + 30) + ' Z" fill="rgba(5,18,20,' + alpha + ')"/>';
    }
    return out;
  }

  function pines(pts, color, hMin, hMax, gap){
    let d = '';
    for(let x = 0; x < W; x += gap*(0.6 + rnd()*0.9)){
      const y = yAt(pts, x) + 2 + rnd()*5, h = hMin + rnd()*(hMax - hMin), w = h*0.3;
      const r = [[0,-h],[0.45,-0.62],[0.2,-0.62],[0.75,-0.3],[0.36,-0.3],[1,0]];
      const right = r.map(q => [x + q[0]*w, y + (q[1] === -h ? -h : q[1]*h)]);
      right[0] = [x, y - h];
      const left = right.slice(1).reverse().map(q => [2*x - q[0], q[1]]);
      d += 'M' + right.concat(left).map(q => f(q[0]) + ',' + f(q[1])).join(' L') + ' Z ';
    }
    return '<path d="' + d + '" fill="' + color + '"/>';
  }

  const layers = [
    { base: 575, amp: 150, freq: 0.9, oct: 4, swellFreq: 0.5, off: 1,  peaks: [{x:1040,h:150,w:130},{x:360,h:95,w:110}],  g: ['#b9cbbd','#8fa89a'], snow: ['rgba(255,255,255,0.55)', 0.30], face: 0.10 },
    { base: 640, amp: 185, freq: 1.0, oct: 5, swellFreq: 0.6, off: 7,  peaks: [{x:610,h:235,w:150},{x:1250,h:175,w:130}], g: ['#86a395','#628375'], snow: ['rgba(246,250,247,0.88)', 0.34], face: 0.16 },
    { base: 710, amp: 190, freq: 1.1, oct: 5, swellFreq: 0.7, off: 13, peaks: [{x:905,h:215,w:170},{x:240,h:165,w:120}],  g: ['#527a69','#3c6050'], snow: ['rgba(238,246,240,0.92)', 0.22], face: 0.20 },
    { base: 780, amp: 140, freq: 1.4, oct: 5, swellFreq: 0.8, off: 21, peaks: [{x:1420,h:90,w:120},{x:60,h:70,w:100}],    g: ['#37584a','#29463a'], face: 0.18 },
    { base: 845, amp: 105, freq: 1.8, oct: 4, swellFreq: 1.0, off: 31, peaks: [{x:760,h:55,w:180}],                          g: ['#203d32','#152b22'] },
    { base: 905, amp: 80,  freq: 2.2, oct: 4, swellFreq: 1.2, off: 41, peaks: [{x:1180,h:40,w:200},{x:300,h:36,w:180}],    g: ['#12251b','#0a1710'] }
  ];

  let defs = '', body = '';
  // sky
  defs += '<linearGradient id="as-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#081a18"/><stop offset="0.26" stop-color="#12342b"/><stop offset="0.42" stop-color="#2d5c49"/><stop offset="0.53" stop-color="#9fa45c"/><stop offset="0.60" stop-color="#e9c46f"/><stop offset="1" stop-color="#f6e0a8"/></linearGradient>';
  defs += '<radialGradient id="as-sun" cx="0.74" cy="0.58" r="0.34"><stop offset="0" stop-color="#fff6d6" stop-opacity="1"/><stop offset="0.22" stop-color="#ffd98a" stop-opacity="0.75"/><stop offset="0.55" stop-color="#f2b955" stop-opacity="0.28"/><stop offset="1" stop-color="#f2b955" stop-opacity="0"/></radialGradient>';
  defs += '<linearGradient id="as-mist" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e6f0e8" stop-opacity="0"/><stop offset="0.55" stop-color="#e6f0e8" stop-opacity="0.34"/><stop offset="1" stop-color="#e6f0e8" stop-opacity="0"/></linearGradient>';
  defs += '<linearGradient id="as-fade" x1="0" y1="0" x2="0" y2="1"><stop offset="0.55" stop-color="#050c08" stop-opacity="0"/><stop offset="1" stop-color="#050c08" stop-opacity="0.85"/></linearGradient>';
  defs += '<radialGradient id="as-vig" cx="0.5" cy="0.5" r="0.75"><stop offset="0.55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.5"/></radialGradient>';
  defs += '<filter id="as-blur" x="-10%" y="-100%" width="120%" height="300%"><feGaussianBlur stdDeviation="14"/></filter>';
  defs += '<filter id="as-relief" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.009 0.024" numOctaves="4" seed="4" result="n"/><feDiffuseLighting in="n" lighting-color="#ffffff" surfaceScale="2.6" diffuseConstant="1.25" result="l"><feDistantLight azimuth="40" elevation="58"/></feDiffuseLighting><feComposite in="l" in2="SourceGraphic" operator="in" result="li"/><feBlend in="SourceGraphic" in2="li" mode="multiply"/></filter>';

  body += '<rect width="' + W + '" height="' + H + '" fill="url(#as-sky)"/>';
  for(let i = 0; i < 90; i++){ const sy = rnd()*300; body += '<circle cx="' + f(rnd()*W) + '" cy="' + f(sy) + '" r="' + f(0.5 + rnd()*1.1) + '" fill="#fff" opacity="' + f((0.85 - sy/380) * (0.4 + rnd()*0.6)) + '"/>'; }
  body += '<rect width="' + W + '" height="' + H + '" fill="url(#as-sun)"/>';

  layers.forEach((L, idx) => {
    const pts = ridge(L);
    defs += '<linearGradient id="as-g' + idx + '" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="' + L.g[0] + '"/><stop offset="1" stop-color="' + L.g[1] + '"/></linearGradient>';
    const relief = (idx >= 1 && idx <= 3) ? ' filter="url(#as-relief)"' : '';
    body += '<path d="' + area(pts) + '" fill="url(#as-g' + idx + ')"' + relief + '/>';
    if(L.face) body += faces(pts, L.base, L.face);
    if(L.snow){ const top = Math.min.apply(null, pts.map(p => p[1])); body += snow(pts, top + (L.base - top)*L.snow[1], L.snow[0], 22); }
    if(idx === 3) body += pines(pts, '#1b352a', 10, 22, 11);
    if(idx === 4) body += pines(pts, '#102219', 16, 34, 13);
    if(idx === 5) body += pines(pts, '#08120c', 26, 58, 17);
    if(idx < 5) body += '<rect x="0" y="' + (L.base - 70) + '" width="' + W + '" height="150" fill="url(#as-mist)" opacity="' + f(0.9 - idx*0.12) + '"/>';
  });

  body += '<ellipse cx="420" cy="640" rx="520" ry="20" fill="#eef5ee" opacity="0.16" filter="url(#as-blur)"/>';
  body += '<ellipse cx="1180" cy="700" rx="560" ry="24" fill="#eef5ee" opacity="0.14" filter="url(#as-blur)"/>';
  body += '<rect width="' + W + '" height="' + H + '" fill="url(#as-fade)"/>';
  body += '<rect width="' + W + '" height="' + H + '" fill="url(#as-vig)"/>';

  return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="xMidYMax slice" aria-hidden="true"><defs>' + defs + '</defs>' + body + '</svg>';
}

let authSceneBuilt = false;
function ensureAuthScene(){
  const el = document.getElementById("auth-scene");
  if(el && !authSceneBuilt){ el.innerHTML = buildAuthScene(); authSceneBuilt = true; }
}

function pwField(id, placeholder, autocomplete){
  return `<div class="pw-wrap"><input type="password" id="${id}" placeholder="${placeholder}" autocomplete="${autocomplete}"><button type="button" class="pw-eye" data-action="toggle-pw" data-target="${id}" aria-label="Show password" title="Show password">${icon("eye",19)}</button></div>`;
}

function renderAuth(){
  document.body.classList.add("auth-mode");
  ensureAuthScene();
  renderAuthInner();
  const card = app.firstElementChild;
  if(card && card.classList.contains("onboard")){
    const wrap = document.createElement("div");
    wrap.className = "auth-center";
    app.insertBefore(wrap, card);
    wrap.appendChild(card);
  }
}

function renderAuthInner(){
  const mode = state.authMode;

  if(mode === "update-password"){
    app.innerHTML = `
    <div class="onboard">
      <h2>Set a new password</h2>
      <p>You followed a password reset link. Choose a new password below.</p>
      <div>
        ${pwField("auth-new-password", "New password", "new-password")}
        ${state.authError ? `<p style="color:var(--rust); font-size:12.5px; margin:-6px 0 12px;">${esc(state.authError)}</p>` : ``}
        <button type="button" data-action="submit-new-password" ${state.authLoading ? "disabled" : ""}>${state.authLoading ? "Please wait…" : "Save new password"}</button>
      </div>
    </div>`;
    return;
  }

  if(mode === "reset"){
    app.innerHTML = `
    <div class="onboard">
      <h2>Reset your password</h2>
      <p>Enter the email you signed up with — we'll send a link to set a new password.</p>
      <div>
        <input type="email" id="auth-email" placeholder="Email" autocomplete="email">
        ${state.authError ? `<p style="color:var(--rust); font-size:12.5px; margin:-6px 0 12px;">${esc(state.authError)}</p>` : ``}
        <button type="button" data-action="submit-reset" ${state.authLoading ? "disabled" : ""}>${state.authLoading ? "Please wait…" : "Send reset link"}</button>
      </div>
      <p class="fine"><a data-action="switch-auth-mode" data-mode="signin" style="color:var(--rust); cursor:pointer; text-decoration:underline;">Back to sign in</a></p>
    </div>`;
    return;
  }

  const isSignup = mode === "signup";
  app.innerHTML = `
  <div class="onboard">
    <div class="auth-brand"><img src="${LOGO_SRC}" alt=""><h2>Summit Log <b>PH</b></h2></div>
    <p>Track the Philippine mountains you've climbed, earn a badge for each one, and see how you stack up against other hikers.</p>
    <div class="auth-chips">
      <span class="auth-chip">${icon("mountain",14)} A badge for every peak</span>
      <span class="auth-chip">${icon("trophy",14)} Climb the rankings</span>
      <span class="auth-chip">${icon("users",14)} Meet fellow hikers</span>
    </div>
    <div>
      ${isSignup ? `<input type="text" id="auth-display-name" placeholder="Your trail name (shown publicly)" maxlength="24">` : ``}
      <input type="email" id="auth-email" placeholder="Email" autocomplete="email">
      ${pwField("auth-password", "Password", isSignup ? "new-password" : "current-password")}
      ${state.authError ? `<p style="color:var(--rust); font-size:12.5px; margin:-6px 0 12px;">${esc(state.authError)}</p>` : ``}
      <button type="button" data-action="submit-auth" ${state.authLoading ? "disabled" : ""}>${state.authLoading ? "Please wait…" : (isSignup ? "Create account" : "Sign in")}</button>
    </div>
    <p class="fine">
      ${isSignup ? `Already have an account? <a data-action="switch-auth-mode" data-mode="signin" style="color:var(--rust); cursor:pointer; text-decoration:underline;">Sign in</a>`
                 : `New here? <a data-action="switch-auth-mode" data-mode="signup" style="color:var(--rust); cursor:pointer; text-decoration:underline;">Create an account</a>
                    &nbsp;·&nbsp; <a data-action="switch-auth-mode" data-mode="reset" style="color:var(--rust); cursor:pointer; text-decoration:underline;">Forgot password?</a>`}
    </p>
    <p class="fine">Your trail name and climb count appear on the public rankings, visible to anyone signed in to this site.</p>
  </div>`;

function badgeCount(n){ return n > 0 ? `<span class="notif-badge">${n>9?'9+':n}</span>` : ``; }

function renderLogHero(){
  const total = MOUNTAINS.length;
  const done = state.hiked.size;
  const elev = MOUNTAINS.filter(m=>state.hiked.has(m.id)).reduce((s,m)=>s+m.maslNum,0);
  const myRank = state.leaderboard.findIndex(e=>e.userId===state.user.id);
  return `
  <div class="hero">
    <div class="hero-stats">
      <div><div class="hero-num">${done}<sub>/${total}</sub></div><div class="hero-sub">Peaks badged</div></div>
      <div><div class="hero-num mono hero-elev">${elev.toLocaleString()}<sub> masl</sub></div><div class="hero-sub">Total elevation climbed</div></div>
    </div>
    <div class="ridge-box">${buildRidgeSVG()}</div>
    <div class="rank-note">${myRank>=0 ? `You're <b>#${myRank+1}</b> of ${state.leaderboard.length} hikers on the board.` : `Mark a mountain as hiked to join the rankings.`}</div>
    <div class="edit-note" style="margin:10px 0 0;">See wrong info, or a mountain that's missing? Use "Edit" on a card, or add a new one below — changes are shared and show for everyone.</div>
  </div>`;
}

// ---- Facebook-style shell: top navbar, left nav, center, right sidebar, mobile bottom nav ----
function renderSearchResults(q){
  const needle = q.trim().toLowerCase();
  const ms = MOUNTAINS.filter(m=>m.name.toLowerCase().includes(needle) || m.place.toLowerCase().includes(needle)).slice(0,5);
  const ps = (state.people||[]).filter(p=>p.name.toLowerCase().includes(needle)).slice(0,5);
  if(!ms.length && !ps.length) return `<div class="fb-search-results"><div class="fb-search-empty">No results for "${esc(q.trim())}"</div></div>`;
  return `<div class="fb-search-results">
    ${ms.length ? `<div class="fb-search-head">Mountains</div>` + ms.map(m=>`<div class="fb-search-item" data-action="search-pick-mountain" data-name="${esc(m.name)}">${icon("mountain",16)} <b>${esc(m.name)}</b><span>${esc(m.place)} · ${esc(m.maslRaw)} masl</span></div>`).join("") : ``}
    ${ps.length ? `<div class="fb-search-head">People</div>` + ps.map(p=>`<div class="fb-search-item" data-view-profile="${p.id}" data-profile-name="${esc(p.name)}">${renderAvatar(p.name, p.avatarUrl, 26)} <b>${esc(p.name)}</b><span>${p.peakCount} peak${p.peakCount!==1?'s':''}</span></div>`).join("") : ``}
  </div>`;
}

function renderAccountMenu(){
  return `<div class="fb-menu-backdrop" data-action="close-account-menu"></div>
  <div class="fb-account-menu">
    <a class="fb-menu-profile" data-tab="wall">${renderAvatar(state.profile.display_name, state.profile.avatar_url, 40)}<div><b>${esc(state.profile.display_name)}</b>${isAdmin() ? ` <span class="admin-tag">admin</span>` : ``}<small>View my profile</small></div></a>
    <a data-action="rename">${icon("pencil",18)} Change name</a>
    <a data-action="change-password">${icon("key",18)} Change password</a>
    ${isAdmin() ? `<a data-tab="reports">${icon("flag",18)} Reports${badgeCount(state.reports ? state.reports.length : 0)}</a>` : ``}
    <a data-action="sign-out">${icon("log-out",18)} Sign out</a>
  </div>`;
}

function renderTopbar(){
  const q = state.globalSearch || "";
  return `<header class="fb-topbar">
    <div class="fb-top-left" data-tab="feed"><img class="brand-logo" src="${LOGO_TILE_SRC}" alt="Summit Log PH"><span class="fb-brand">Summit Log <b>PH</b></span></div>
    <div class="fb-top-search">
      <span class="fb-search-ico">${icon("search",16)}</span>
      <input type="text" id="global-search" placeholder="Search mountains or people" value="${esc(q)}" autocomplete="off">
      ${q.trim() ? renderSearchResults(q) : ``}
    </div>
    <nav class="fb-top-icons">
      <button class="fb-icon-btn fb-home-btn ${state.view==='feed'?'active':''}" data-tab="feed" title="Home">${icon("home",21)}</button>
      <button class="fb-icon-btn" data-tab="feed" title="Notifications">${icon("bell",21)}${badgeCount(state.notificationCount)}</button>
      <button class="fb-icon-btn ${state.messenger.open?'active':''}" data-tab="messages" title="Messages">${icon("message",21)}${badgeCount(state.unreadMessageCount)}</button>
      <div class="fb-account-wrap">
        <button class="fb-avatar-btn" data-action="toggle-account-menu" title="Account">${renderAvatar(state.profile.display_name, state.profile.avatar_url, 40)}</button>
        ${state.accountMenuOpen ? renderAccountMenu() : ``}
      </div>
    </nav>
  </header>`;
}

function renderLeftNav(){
  const item = (view, ico, label, badge) => `<a class="fb-nav-item ${(view==="messages" ? state.messenger.open : state.view===view)?'active':''}" data-tab="${view}"><span class="fb-nav-ico">${icon(ico,19)}</span><span>${label}</span>${badge||""}</a>`;
  return `<nav class="fb-leftnav">
    <a class="fb-nav-profile" data-tab="wall">${renderAvatar(state.profile.display_name, state.profile.avatar_url, 38)}<span>${esc(state.profile.display_name)}${isAdmin() ? ` <span class="admin-tag">admin</span>` : ``}</span></a>
    ${item("feed","home","Feed", badgeCount(state.notificationCount))}
    ${item("log","route","My Trails")}
    ${item("wall","trophy","Badges")}
    ${item("people","users","People")}
    ${item("rankings","bar-chart","Rankings")}
    ${item("messages","message","Messages", badgeCount(state.unreadMessageCount))}
    ${isAdmin() ? item("reports","flag","Reports", badgeCount(state.reports ? state.reports.length : 0)) : ``}
  </nav>`;
}

function widgetHead(title, linkLabel, tab){

const REGION_MAP = [
  ["Luzon", ["benguet","nueva vizcaya","ifugao","kalinga","mountain province","cagayan","zambales","tarlac","pampanga","bulacan","rizal","laguna","batangas","cavite","quezon","bataan","camarines","albay","sorsogon","mindoro","palawan","bicol"]],
  ["Visayas", ["cebu","negros","iloilo","antique","aklan","capiz","leyte","samar","siquijor","bohol","romblon"]],
  ["Mindanao", ["davao","cotabato","bukidnon","zamboanga","misamis","agusan","surigao","camiguin","lanao","maguindanao","sarangani","sultan kudarat"]]
];
function inferRegion(place){
  const p = String(place).toLowerCase();
  for(const [region, keys] of REGION_MAP){
    if(keys.some(k=>p.includes(k))) return region;
  }
  return "Other";
}

function getFiltered(){
  const q = state.search.trim().toLowerCase();
  let list = MOUNTAINS.slice();
  if(state.region !== "all") list = list.filter(m => inferRegion(m.place) === state.region);
  if(state.status === "hiked") list = list.filter(m => state.hiked.has(m.id));
  else if(state.status === "not-yet") list = list.filter(m => !state.hiked.has(m.id));
  if(q) list = list.filter(m => m.name.toLowerCase().includes(q) || m.place.toLowerCase().includes(q));
  return list;
}

const PAGE_SIZE = 12;

function renderLog(){
  const filtered = getFiltered();
  let body = "";
  if(filtered.length === 0){
    const msg = state.search.trim() ? `No mountains match "${esc(state.search)}".`
      : state.status === "hiked" ? "You haven't badged any mountains in this region yet."
      : state.status === "not-yet" ? "Nothing left here — you've badged every mountain matching these filters."
      : "No mountains match these filters.";
    body = `<div class="no-results">${msg}</div>`;
  } else if(state.sort === "groups"){
    const groups = {};
    filtered.forEach(m=>{
      const cat = CAT(m.difficulty).label;
      (groups[cat] = groups[cat]||[]).push(m);
    });
    const isSearching = state.search.trim().length > 0;
    const presentCats = GROUP_ORDER.filter(cat=>groups[cat]);
    const allExpanded = presentCats.length > 0 && presentCats.every(cat=>state.expandedGroups.has(cat));
    body += `<div class="expand-all-row"><a data-action="toggle-expand-all">${allExpanded ? "Collapse all" : "Expand all"}</a></div>`;
    presentCats.forEach(cat=>{
      const list = groups[cat];
      list.sort((a,b)=>b.maslNum-a.maslNum);
      const c = CAT(cat);
      const doneInGroup = list.filter(m=>state.hiked.has(m.id)).length;
      const expanded = isSearching || state.expandedGroups.has(cat);
      const visibleCount = state.visibleCounts["group:"+cat] || PAGE_SIZE;
      const visibleList = list.slice(0, visibleCount);
      const remaining = list.length - visibleList.length;
      body += `<div class="group">
        <div class="group-head" data-action="toggle-group" data-group="${esc(cat)}">
          <span class="swatch" style="background:${c.fill}"></span>
          <h3>${cat}</h3>
          <span class="count">${doneInGroup}/${list.length} badged</span>
          <span class="group-chevron">${expanded ? "▲" : "▼"}</span>
        </div>
        ${expanded ? `
          <div class="grid">
            ${visibleList.map(m=>cardHTML(m)).join("")}
          </div>
          ${remaining > 0 ? `<button class="btn load-more-btn" data-action="load-more-group" data-group="${esc(cat)}">Show ${Math.min(PAGE_SIZE, remaining)} more (${remaining} left)</button>` : ``}
        ` : ``}
      </div>`;
    });
  } else {
    const list = filtered.slice();
    if(state.sort === "elev-desc") list.sort((a,b)=>b.maslNum-a.maslNum);
    else if(state.sort === "elev-asc") list.sort((a,b)=>a.maslNum-b.maslNum);
    else if(state.sort === "name-asc") list.sort((a,b)=>a.name.localeCompare(b.name));
    const visibleCount = state.visibleCounts["flat"] || PAGE_SIZE;
    const visibleList = list.slice(0, visibleCount);
    const remaining = list.length - visibleList.length;
    body = `<div class="grid">${visibleList.map(m=>cardHTML(m)).join("")}</div>
      ${remaining > 0 ? `<button class="btn load-more-btn" data-action="load-more-flat">Show ${Math.min(PAGE_SIZE, remaining)} more (${remaining} left)</button>` : ``}`;
  }
  return renderControls() + renderAddMountainSection() + body;
}

const REGION_ORDER = ["Luzon","Visayas","Mindanao","Other"];
const REGION_COLOR = {Luzon:"var(--moss)", Visayas:"var(--teal)", Mindanao:"var(--rust)", Other:"var(--thread)"};

function computeStats(){
  const done = MOUNTAINS.filter(m=>state.hiked.has(m.id));
  const byRegion = {}, byDiff = {};
  done.forEach(m=>{
    const r = inferRegion(m.place);
    byRegion[r] = byRegion[r] || {count:0, elev:0};
    byRegion[r].count++; byRegion[r].elev += m.maslNum;
    const cat = CAT(m.difficulty).label;
    byDiff[cat] = byDiff[cat] || {count:0, elev:0};
    byDiff[cat].count++; byDiff[cat].elev += m.maslNum;
  });
  return {byRegion, byDiff};
}

function renderBarRows(dataObj, orderList, colorFn){
  const entries = orderList.filter(k=>dataObj[k]).map(k=>({key:k, ...dataObj[k]}));
  if(entries.length === 0) return `<p style="font-size:12px; color:var(--ink-soft);">Nothing here yet.</p>`;
  const maxElev = Math.max(...entries.map(e=>e.elev), 1);
  return entries.map(e=>{
    const pct = Math.max(6, Math.round((e.elev/maxElev)*100));
    return `<div class="stat-row">
      <div class="stat-label">${esc(e.key)}</div>
      <div class="stat-bar-track"><div class="stat-bar-fill" style="width:${pct}%; background:${colorFn(e.key)};"></div></div>
      <div class="stat-value mono">${e.count} pk · ${e.elev.toLocaleString()} m</div>
    </div>`;
  }).join("");
}

function renderStats(){
  const {byRegion, byDiff} = computeStats();
  return `
  <h3 style="margin:30px 0 4px;">My climbing breakdown</h3>
  <p style="font-size:13px; color:var(--ink-soft); margin:0 0 4px;">Elevation climbed, by region and by difficulty.</p>
  <div class="stats-grid">
    <div class="stats-col">
      <h4>By region</h4>
      ${renderBarRows(byRegion, REGION_ORDER, k=>REGION_COLOR[k]||"var(--thread)")}
    </div>
    <div class="stats-col">
      <h4>By difficulty</h4>
      ${renderBarRows(byDiff, GROUP_ORDER, k=>CAT(k).fill)}
    </div>
  </div>`;
}

  return `<div class="post-photos ${countClass}">
    ${shown.map((url,i)=>`
      <div class="post-photo-item-wrap">
        <img class="post-photo-item" src="${esc(url)}" data-view-photo="${esc(url)}">
        ${(i===shown.length-1 && extra>0) ? `<div class="post-photo-more" data-view-photo="${esc(url)}">+${extra}</div>` : ``}
      </div>

}

function renderRankings(){
  let rows = state.leaderboard.slice();
  if(state.rankActive === "month"){
    const cutoff = Date.now() - 30*24*60*60*1000;
    rows = rows.filter(r => r.updated && r.updated >= cutoff);
  }
  const region = state.rankRegion;
  let getCount, getElev;
  if(region === "all"){
    getCount = r => r.count || 0;
    getElev = r => r.elev || 0;
  } else {
    getCount = r => (r.regionCounts && r.regionCounts[region]) || 0;
    getElev = r => (r.regionElev && r.regionElev[region]) || 0;
    rows = rows.filter(r => getCount(r) > 0);
  }
  rows.sort((a,b) => (getCount(b)-getCount(a)) || (getElev(b)-getElev(a)));

  let body = "";
  if(rows.length === 0){
    body = `<div class="empty">${state.rankActive==='month' ? "No hikers logged a climb in the last 30 days." : "No hikers on the board yet. Be the first to badge a peak."}</div>`;
  } else {
    body = rows.map((r,i)=>`
      <div class="rank-row ${r.userId===state.user.id?'me':''}">
        <div class="rank-num">#${i+1}</div>
        <div class="rank-name" data-view-profile="${r.userId}" data-profile-name="${esc(r.name)}">${esc(r.name)}</div>
        <div class="rank-count">${getCount(r)} peaks</div>
        <div class="rank-elev mono">${getElev(r).toLocaleString()} m</div>

    <select id="rank-region-select">
      <option value="all" ${region==='all'?'selected':''}>All regions</option>
      <option value="Luzon" ${region==='Luzon'?'selected':''}>Luzon</option>
      <option value="Visayas" ${region==='Visayas'?'selected':''}>Visayas</option>
      <option value="Mindanao" ${region==='Mindanao'?'selected':''}>Mindanao</option>
    </select>
    <select id="rank-active-select">
      <option value="all" ${state.rankActive==='all'?'selected':''}>All time</option>
      <option value="month" ${state.rankActive==='month'?'selected':''}>Active in the last 30 days</option>
    </select>
  </div>
  <div class="rank-wrap">
    <div class="rank-row head"><div>#</div><div>Hiker</div><div>Peaks</div><div>Elevation</div></div>

function buildCoverScene(){
  const W = 1200, H = 300;
  let seed = 7788;
  const rnd = () => { seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  const mkNoise = () => { const p = Array.from({length:256}, rnd); return x => { const i = Math.floor(x), fr = x - i, t = fr*fr*(3-2*fr); const a = p[i & 255], b = p[(i+1) & 255]; return a + (b-a)*t; }; };
  const f = n => n.toFixed(0);
  function ridge(o){
    const noise = mkNoise(), swell = mkNoise(), pts = [];
    for(let x = -12; x <= W + 12; x += 12){
      let v = 0, a = 1, fq = o.freq, norm = 0;
      for(let k = 0; k < o.oct; k++){ const n = noise(x*fq/100 + k*17.3 + o.off); v += a*(1 - Math.abs(2*n - 1)); norm += a; a *= 0.5; fq *= 2.15; }
      v /= norm;
      let h = o.amp * (0.55*v + 0.45*swell(x*o.swellFreq/100 + o.off*3));
      (o.peaks || []).forEach(p => { const d = Math.abs(x - p.x)/p.w; h += p.h*Math.exp(-Math.pow(d, 1.35)*1.7); });
      pts.push([x, o.base - h]);
    }
    return pts;
  }
  const area = pts => 'M' + f(pts[0][0]) + ',' + (H + 10) + pts.map(p => ' L' + f(p[0]) + ',' + f(p[1])).join('') + ' L' + f(pts[pts.length-1][0]) + ',' + (H + 10) + ' Z';
  const yAt = (pts, x) => { const i = Math.max(0, Math.min(pts.length - 2, Math.floor((x - pts[0][0]) / 12))); return pts[i][1] + (pts[i+1][1] - pts[i][1]) * (((x - pts[i][0]) / 12) % 1); };
  function snow(pts, snowY, fill){
    let out = '', run = [];
    const flush = () => {
      if(run.length > 2){
        let d = 'M' + f(run[0][0]) + ',' + f(run[0][1]);
        for(let i = 1; i < run.length; i++) d += ' L' + f(run[i][0]) + ',' + f(run[i][1]);
        for(let i = run.length - 1; i >= 0; i--){ const x = run[i][0]; const y = snowY + (i % 2 ? 11*rnd() : 4*rnd()) + 4*Math.sin(x*0.09); d += ' L' + f(x) + ',' + f(Math.max(y, run[i][1] + 2)); }
        out += '<path d="' + d + 'Z" fill="' + fill + '"/>';
      }
      run = [];
    };
    pts.forEach(p => { if(p[1] < snowY) run.push(p); else flush(); });
    flush(); return out;
  }
  function pines(pts, color, hMin, hMax, gap){
    let d = '';
    for(let x = 0; x < W; x += gap*(0.6 + rnd()*0.9)){
      const y = yAt(pts, x) + 2 + rnd()*4, h = hMin + rnd()*(hMax - hMin), w = h*0.3;
      const r = [[0.45,-0.62],[0.2,-0.62],[0.75,-0.3],[0.36,-0.3],[1,0]];
      const right = [[x, y - h]].concat(r.map(q => [x + q[0]*w, y + q[1]*h]));
      const left = right.slice(1).reverse().map(q => [2*x - q[0], q[1]]);
      d += 'M' + right.concat(left).map(q => f(q[0]) + ',' + f(q[1])).join(' L') + 'Z';
    }
    return '<path d="' + d + '" fill="' + color + '"/>';
  }
  const L = [
    { base: 215, amp: 105, freq: 1.0, oct: 4, swellFreq: 0.5, off: 3,  peaks: [{x:380,h:70,w:90},{x:900,h:55,w:80}], g: ['#a9bfb2','#86a08f'], snow: ['rgba(255,255,255,0.7)', 0.30] },
    { base: 262, amp: 100, freq: 1.2, oct: 5, swellFreq: 0.7, off: 11, peaks: [{x:700,h:65,w:100}],                 g: ['#4f7766','#37594a'], snow: ['rgba(240,247,242,0.9)', 0.22] },
    { base: 305, amp: 60,  freq: 1.8, oct: 4, swellFreq: 1.0, off: 19, peaks: [{x:200,h:30,w:120},{x:1020,h:34,w:120}], g: ['#1e3a2f','#12261d'] }
  ];
  let defs = '<linearGradient id="dc-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b201b"/><stop offset="0.45" stop-color="#25503f"/><stop offset="0.72" stop-color="#d9b866"/><stop offset="1" stop-color="#f4dca3"/></linearGradient>'
    + '<radialGradient id="dc-sun" cx="0.74" cy="0.66" r="0.4"><stop offset="0" stop-color="#fff3cc" stop-opacity="0.95"/><stop offset="0.35" stop-color="#f3c773" stop-opacity="0.4"/><stop offset="1" stop-color="#f3c773" stop-opacity="0"/></radialGradient>'
    + '<linearGradient id="dc-mist" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e6f0e8" stop-opacity="0"/><stop offset="0.6" stop-color="#e6f0e8" stop-opacity="0.3"/><stop offset="1" stop-color="#e6f0e8" stop-opacity="0"/></linearGradient>'
    + '<linearGradient id="dc-fade" x1="0" y1="0" x2="0" y2="1"><stop offset="0.6" stop-color="#050c08" stop-opacity="0"/><stop offset="1" stop-color="#050c08" stop-opacity="0.55"/></linearGradient>';
  let body = '<rect width="' + W + '" height="' + H + '" fill="url(#dc-sky)"/>';
  for(let i = 0; i < 26; i++) body += '<circle cx="' + f(rnd()*W) + '" cy="' + f(rnd()*90) + '" r="' + (0.6 + rnd()).toFixed(1) + '" fill="#fff" opacity="' + (0.25 + rnd()*0.5).toFixed(2) + '"/>';
  body += '<rect width="' + W + '" height="' + H + '" fill="url(#dc-sun)"/>';
  L.forEach((l, i) => {
    const pts = ridge(l);
    defs += '<linearGradient id="dc-g' + i + '" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="' + l.g[0] + '"/><stop offset="1" stop-color="' + l.g[1] + '"/></linearGradient>';
    body += '<path d="' + area(pts) + '" fill="url(#dc-g' + i + ')"/>';
    if(l.snow){ const top = Math.min.apply(null, pts.map(p => p[1])); body += snow(pts, top + (l.base - top)*l.snow[1], l.snow[0]); }
    if(i === 2) body += pines(pts, '#0b1a13', 14, 30, 15);
    if(i < 2) body += '<rect x="0" y="' + (l.base - 40) + '" width="' + W + '" height="90" fill="url(#dc-mist)"/>';
  });
  body += '<rect width="' + W + '" height="' + H + '" fill="url(#dc-fade)"/>';
  return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs>' + defs + '</defs>' + body + '</svg>';
}

let defaultCoverSvg = null;
function getDefaultCover(){ return defaultCoverSvg || (defaultCoverSvg = buildCoverScene()); }

// Shrinks big phone photos (usually 3-8 MB) to a web-sized JPEG before uploading. Falls back to the original file if the browser can't.
async function prepareImageForUpload(file, maxWidth, quality){
  try{
    if(typeof createImageBitmap !== "function") return file;
    if(file.type === "image/gif" || file.type === "image/svg+xml") return file;
    const bmp = await createImageBitmap(file);
    const scale = Math.min(1, maxWidth / bmp.width);
    if(scale === 1 && file.size < 900*1024){ if(bmp.close) bmp.close(); return file; }
    const canvas = document.createElement("canvas");
    canvas.width = Math.round(bmp.width * scale);
    canvas.height = Math.round(bmp.height * scale);
    const ctx = canvas.getContext("2d");
    if(!ctx){ if(bmp.close) bmp.close(); return file; }
    ctx.drawImage(bmp, 0, 0, canvas.width, canvas.height);
    if(bmp.close) bmp.close();
    const blob = await new Promise(res => canvas.toBlob(res, "image/jpeg", quality));
    return blob || file;
  }catch(err){ return file; }
}

function renderProfileCover(coverUrl, editable){
  const media = coverUrl
    ? `<img class="profile-cover-img" src="${esc(coverUrl)}" alt="Cover photo" data-view-photo="${esc(coverUrl)}">`
    : getDefaultCover();
  const edit = editable
    ? `<label class="cover-edit-btn" title="${coverUrl ? "Change cover photo" : "Add a cover photo"}">${icon("camera",16)}<span>${coverUrl ? "Change cover" : "Add cover photo"}</span><input type="file" id="cover-input" accept="image/*"></label>`
    : ``;
  return `<div class="profile-cover ${coverUrl ? "has-img" : "is-default"}">${media}${edit}</div>`;
}

async function uploadCoverFromInput(inputEl){
  const file = inputEl.files && inputEl.files[0];
  if(!file) return;
  const looksLikeImage = file.type ? /^image\//.test(file.type) : /\.(jpe?g|png|webp|gif|heic|heif)$/i.test(file.name || "");
  if(!looksLikeImage){ showToast("Please choose an image file."); inputEl.value = ""; return; }
  if(file.size > 15*1024*1024){ showToast("That photo is over 15 MB. Please choose a smaller one."); inputEl.value = ""; return; }
  showToast("Uploading cover photo…");
  const prepared = await prepareImageForUpload(file, 1600, 0.86);
  const converted = prepared !== file;
  const ext = converted ? "jpg" : ((file.name.split(".").pop() || "jpg").toLowerCase().replace(/[^a-z0-9]/g,"") || "jpg");
  const path = `${state.user.id}/cover.${ext}`;
  const { error: upErr } = await sb.storage.from("climb-photos").upload(path, prepared, { upsert: true, contentType: converted ? "image/jpeg" : (file.type || undefined) });
  if(upErr){ showToast("Could not upload cover photo: "+upErr.message); return; }
  const { data } = sb.storage.from("climb-photos").getPublicUrl(path);
  const url = data.publicUrl + "?t=" + Date.now();
  const { error } = await sb.from("profiles").update({ cover_url: url }).eq("id", state.user.id);
  if(error){ showToast("Could not save cover photo: "+error.message); return; }
  state.profile.cover_url = url;
  render();
  showToast("Cover photo updated.");
}

async function uploadAvatarFromInput(inputEl){
  const file = inputEl.files && inputEl.files[0];
  if(!file) return;
  const ext = (file.name.split(".").pop() || "jpg").toLowerCase().replace(/[^a-z0-9]/g,"") || "jpg";
  const path = `${state.user.id}/avatar.${ext}`;
  const { error: upErr } = await sb.storage.from("climb-photos").upload(path, file, { upsert: true });
  if(upErr){ showToast("Could not upload photo: "+upErr.message); return; }
  const { data } = sb.storage.from("climb-photos").getPublicUrl(path);
  const url = data.publicUrl + "?t=" + Date.now();
  const { error } = await sb.from("profiles").update({ avatar_url: url }).eq("id", state.user.id);
  if(error){ showToast("Could not save photo: "+error.message); return; }
  state.profile.avatar_url = url;
  render();
  showToast("Profile photo updated.");
}

async function submitAuth(){
  const email = (document.getElementById("auth-email")||{}).value?.trim() || "";
  const password = (document.getElementById("auth-password")||{}).value || "";
  const isSignup = state.authMode === "signup";
  const displayName = isSignup ? ((document.getElementById("auth-display-name")||{}).value?.trim() || "") : "";
  if(!email || !password){ state.authError = "Enter an email and password."; render(); return; }
  if(isSignup && !displayName){ state.authError = "Enter a trail name."; render(); return; }

  state.authLoading = true; state.authError = null; render();

  if(isSignup){
    const { data, error } = await sb.auth.signUp({ email, password, options: { data: { display_name: displayName } } });
    if(error){ state.authError = error.message; state.authLoading = false; render(); return; }
    if(data.session){
      await handleSignedIn(data.user);
    } else {
      state.authLoading = false;
      state.authMode = "signin";
      state.authError = null;
      render();
      showToast("Check your email to confirm your account, then sign in.");
    }
  } else {
    const { data, error } = await sb.auth.signInWithPassword({ email, password });
    if(error){ state.authError = error.message; state.authLoading = false; render(); return; }
    await handleSignedIn(data.user);
  }
}

function switchAuthMode(mode){
  state.authMode = mode || (state.authMode === "signin" ? "signup" : "signin");
  state.authError = null;
  render();
}

async function requestPasswordReset(){
  const email = (document.getElementById("auth-email")||{}).value?.trim() || "";
  if(!email){ state.authError = "Enter your email."; render(); return; }
  state.authLoading = true; state.authError = null; render();
  const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: window.location.href.split("#")[0] });
  state.authLoading = false;
  if(error){ state.authError = error.message; render(); return; }
  state.authMode = "signin";
  render();
  showToast("Check your email for a password reset link.");
}

async function submitNewPassword(){
  const pw = (document.getElementById("auth-new-password")||{}).value || "";
  if(!pw || pw.length < 6){ state.authError = "Password must be at least 6 characters."; render(); return; }
  state.authLoading = true; state.authError = null; render();
  const { error } = await sb.auth.updateUser({ password: pw });
  state.authLoading = false;
  if(error){ state.authError = error.message; render(); return; }
  showToast("Password updated. You're signed in.");
  const { data: { session } } = await sb.auth.getSession();
  if(session && session.user){ await handleSignedIn(session.user); }
  else { state.authMode = "signin"; render(); }
}

async function signOutUser(){
  await sb.auth.signOut();
  unsubscribeFromMessages();
  state.chatWindows = []; state.messenger = { open:false, search:"" }; state.conversations = []; state.unreadMessageCount = 0; state.accountMenuOpen = false;
  state.user = null;
  state.profile = null;
  state.hiked = new Set();
  state.hikedDates = {};
  state.leaderboard = [];
  celebrated = new Set();
  state.view = "log";
  state.authMode = "signin";
  render();
}

async function handleSignedIn(user){
  state.user = user;
  state.loading = true;
  render();
  let { data: profile, error: fetchErr } = await sb.from("profiles").select("*").eq("id", user.id).single();
  if(!profile){
    const metaName = user.user_metadata && user.user_metadata.display_name;
    const fallbackName = metaName || (user.email || "Hiker").split("@")[0];
    const { data: created, error: createErr } = await sb.from("profiles").insert({ id: user.id, display_name: fallbackName }).select().single();
    if(createErr){ showToast("Could not create your profile: "+createErr.message); state.loading = false; render(); return; }
    profile = created;
  }
  state.profile = profile;
  celebrated = new Set(profile && profile.celebrated ? profile.celebrated : []);
  state.lastSeenNotifications = (profile && profile.last_seen_notifications_at) || null;
  await loadMountains();
  await loadMyClimbs();
  await loadLeaderboard();
  await loadFollowing();
  await loadPeople();
  await loadConversations();
  await refreshNotificationCount();
  subscribeToMessages();
  state.authLoading = false;
  state.loading = false;
  render();
}

  if(e.key === "Escape" && (state.globalSearch || state.accountMenuOpen)){
    state.globalSearch = ""; state.accountMenuOpen = false; render();
  }
  if(e.key === "Enter" && (e.target.id === "auth-email" || e.target.id === "auth-password" || e.target.id === "auth-display-name")){
    e.preventDefault();
    if(state.authMode === "reset") requestPasswordReset();

    e.preventDefault();

(async function init(){
  state.loading = true;
  render();

  const isRecovery = window.location.hash.includes("type=recovery");
  if(isRecovery){
    state.authMode = "update-password";
    state.loading = false;
    render();
  } else {
    const { data: { session } } = await sb.auth.getSession();
    if(session && session.user){
      await handleSignedIn(session.user);
    } else {
      state.loading = false;
      render();
    }
  }

  sb.auth.onAuthStateChange(async (event, session) => {
    if(event === "PASSWORD_RECOVERY"){
      state.authMode = "update-password";
      state.loading = false;
      render();
      return;
    }
    if(event === "SIGNED_IN" && session && session.user && (!state.user || state.user.id !== session.user.id)){
      if(state.authMode === "update-password") return;
      await handleSignedIn(session.user);
    }
    if(event === "SIGNED_OUT"){
      unsubscribeFromMessages();
      state.chatWindows = []; state.messenger = { open:false, search:"" }; state.conversations = []; state.unreadMessageCount = 0; state.accountMenuOpen = false;
      state.user = null;
      state.profile = null;
      state.hiked = new Set();
      state.hikedDates = {};
      state.leaderboard = [];
      celebrated = new Set();
      state.view = "log";
      state.authMode = "signin";
      state.loading = false;
      render();
    }
  });
})();
</script>
