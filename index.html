<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Summit Log · Philippine Mountain Badges</title>
<style>
/* Google Fonts import removed — this sandbox restricts external network calls at load time, which was blocking the page from rendering. Font stacks below already fall back to system sans-serif/monospace fonts safely. */

:root{
  --bg: #202b21;
  --bg-raised: #263323;
  --canvas: #f2e9d0;
  --canvas-dim: #e8dcb8;
  --ink: #2a2f22;
  --ink-soft: #5b5c47;
  --thread: #7c6a3f;
  --moss: #6b8f5c;
  --moss-d: #35401e;
  --teal: #4f8f81;
  --teal-d: #1e3730;
  --gold: #c9a227;
  --gold-d: #4a3a0c;
  --amber: #c2791f;
  --amber-d: #4a2c07;
  --rust: #b5502e;
  --rust-d: #481f10;
  --brick: #8b3a3a;
  --brick-d: #3a1414;
}
*{box-sizing:border-box;}
body{
  margin:0;
  background: var(--bg);
  color: var(--canvas);
  font-family:'Inter', sans-serif;
  overflow-x:hidden;
}
.wrap{max-width:980px;margin:0 auto;padding:28px 20px 80px;}
h1,h2,h3{font-family:'Oswald',sans-serif; text-transform:uppercase; letter-spacing:0.03em; margin:0;}
.mono{font-family:'JetBrains Mono', monospace;}
.topbar{display:flex; align-items:baseline; justify-content:space-between; flex-wrap:wrap; gap:10px; margin-bottom:20px; border-bottom:1px solid rgba(242,233,208,0.18); padding-bottom:14px;}
.brand{font-size:22px; font-weight:700; color:var(--canvas);}
.brand span{color:var(--rust);}
.tabs{display:flex; gap:6px;}
.tab-btn{
  font-family:'Oswald',sans-serif; text-transform:uppercase; letter-spacing:0.03em; font-size:13px;
  background:transparent; color:var(--canvas-dim); border:1px solid rgba(242,233,208,0.25);
  padding:8px 16px; cursor:pointer; border-radius:3px;
}
.tab-btn.active{ background:var(--canvas); color:var(--ink); border-color:var(--canvas); font-weight:600;}

.hero{margin:10px 0 26px;}
.hero-stats{display:flex; gap:28px; flex-wrap:wrap; align-items:flex-end; margin-bottom:14px;}
.hero-num{font-family:'Oswald',sans-serif; font-size:46px; font-weight:700; color:var(--canvas); line-height:1;}
.hero-num.hero-elev{font-size:32px;}
.hero-num sub{font-size:18px; color:var(--canvas-dim); font-weight:500;}
.hero-sub{font-size:13px; color:var(--canvas-dim); text-transform:uppercase; letter-spacing:0.05em;}
.ridge-box{width:100%; overflow:hidden; border-radius:4px; background:linear-gradient(to bottom, #16351f 0%, #0f2016 100%);}
.ridge-box svg{display:block; width:100%; height:auto;}
.rank-note{margin-top:10px; font-size:13px; color:var(--canvas-dim);}
.rank-note b{color:var(--gold);}

.onboard{max-width:440px; margin:60px auto; background:var(--canvas); color:var(--ink); border-radius:6px; padding:32px 30px; border:1px dashed var(--thread);}
.onboard h2{font-size:22px; margin-bottom:6px;}
.onboard p{font-size:14px; color:var(--ink-soft); line-height:1.6; margin:0 0 18px;}
.onboard input{
  width:100%; padding:10px 12px; font-size:15px; font-family:'Inter',sans-serif;
  border:1px solid var(--thread); border-radius:3px; background:#fffdf4; color:var(--ink); margin-bottom:14px;
}
.onboard button, .btn{
  font-family:'Oswald',sans-serif; text-transform:uppercase; letter-spacing:0.03em; font-size:13px;
  background:var(--rust); color:#fff2e6; border:none; padding:10px 18px; border-radius:3px; cursor:pointer; font-weight:600;
}
.onboard button:hover, .btn:hover{background:#9c4426;}
.onboard .fine{font-size:11.5px; color:var(--ink-soft); margin-top:10px; line-height:1.5;}

.namebar{display:flex; align-items:center; gap:10px; font-size:13px; color:var(--canvas-dim); margin-bottom:22px;}
.namebar a{color:var(--gold); cursor:pointer; text-decoration:underline;}

.group{margin-bottom:26px;}
.group-head{display:flex; align-items:center; gap:10px; margin-bottom:12px; cursor:pointer; user-select:none;}
.group-head:hover{opacity:0.85;}
.group-chevron{margin-left:auto; font-size:10px; color:var(--canvas-dim);}
.expand-all-row{margin:2px 0 16px;}
.expand-all-row a{font-size:12px; color:var(--gold); cursor:pointer; text-decoration:underline;}
.load-more-btn{display:block; width:100%; margin:14px 0 4px; padding:10px 0; font-size:12px;}
.group-head h3{font-size:15px; color:var(--canvas);}
.group-head .swatch{width:11px; height:11px; border-radius:50%;}
.group-head .count{font-size:12px; color:var(--canvas-dim);}
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(215px,1fr)); gap:14px;}

.controls-row{display:flex; gap:10px; margin-bottom:20px; flex-wrap:wrap;}
.controls-row input[type=text]{flex:1; min-width:180px; padding:9px 12px; font-size:14px; border:1px solid rgba(242,233,208,0.3); border-radius:3px; background:var(--bg-raised); color:var(--canvas); font-family:'Inter',sans-serif;}
.controls-row input[type=text]::placeholder{color:var(--canvas-dim);}
.controls-row select{padding:9px 10px; font-size:13px; border:1px solid rgba(242,233,208,0.3); border-radius:3px; background:var(--bg-raised); color:var(--canvas); font-family:'Inter',sans-serif;}
.no-results{padding:30px 16px; text-align:center; color:var(--canvas-dim); font-size:13px;}

.wall-head{margin-bottom:18px;}
.wall-head p{font-size:13px; color:var(--canvas-dim); margin:4px 0 0;}
.wall-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(126px,1fr)); gap:18px; background:var(--bg-raised); border-radius:8px; padding:24px; border:1px solid rgba(242,233,208,0.1);}
.wall-badge{display:flex; flex-direction:column; align-items:center; text-align:center; gap:6px;}
.wall-name{font-family:'Oswald',sans-serif; font-size:12.5px; font-weight:600; color:var(--canvas); line-height:1.2;}
.wall-place{font-size:10.5px; color:var(--canvas-dim);}
.wall-actions{display:flex; gap:10px; margin-top:12px; flex-wrap:wrap;}
.wall-actions .toggle-btn{width:auto; padding:9px 18px; margin-top:0;}
.toast{position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--canvas); color:var(--ink); padding:10px 20px; border-radius:4px; font-size:13px; font-weight:600; box-shadow:0 6px 18px rgba(0,0,0,0.35); z-index:50; max-width:80vw; text-align:center;}
.celebration{position:fixed; inset:0; display:flex; align-items:center; justify-content:center; pointer-events:none; z-index:80; padding:20px;}
.celebration-card{background:var(--canvas); color:var(--ink); padding:26px 36px; border-radius:10px; text-align:center; box-shadow:0 12px 44px rgba(0,0,0,0.45); border:2px solid var(--gold); animation:celeb-pop 0.4s ease-out;}
.celebration-emoji{font-size:24px; margin-bottom:8px; letter-spacing:4px;}
.celebration-title{font-family:'Oswald',sans-serif; font-size:21px; font-weight:700; letter-spacing:0.02em;}
.celebration-sub{font-size:13px; color:var(--ink-soft); margin-top:6px;}
@keyframes celeb-pop{ from{ transform:scale(0.7); opacity:0; } to{ transform:scale(1); opacity:1; } }
.modal-backdrop{position:fixed; inset:0; background:rgba(15,20,15,0.6); display:flex; align-items:center; justify-content:center; z-index:100; padding:20px;}
.modal-box{background:var(--canvas); color:var(--ink); border-radius:6px; padding:24px; max-width:360px; width:100%; border:1px dashed var(--thread);}
.modal-box p{font-size:14px; line-height:1.5; margin:0 0 16px;}
.modal-box input{width:100%; padding:9px 12px; font-size:14px; border:1px solid var(--thread); border-radius:3px; background:#fffdf4; color:var(--ink); margin-bottom:16px; font-family:'Inter',sans-serif;}
.modal-actions{display:flex; gap:10px; justify-content:flex-end;}
.modal-actions .btn{padding:8px 16px;}
.modal-actions .toggle-btn{width:auto; padding:8px 16px; margin-top:0;}

.wall-panel{background:var(--bg-raised); border-radius:8px; padding:26px 20px; background-image:repeating-linear-gradient(135deg, rgba(242,233,208,0.03) 0px, rgba(242,233,208,0.03) 1px, transparent 1px, transparent 14px);}
.wall-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); gap:22px 14px; justify-items:center;}
.patch{display:flex; flex-direction:column; align-items:center; text-align:center; cursor:default; transition:transform 0.15s ease;}
.patch:hover{transform:rotate(0deg) scale(1.06);}
.patch-name{font-family:'Oswald',sans-serif; font-size:12px; font-weight:600; color:var(--canvas); margin-top:6px; line-height:1.25;}
.patch-sub{font-size:10.5px; color:var(--canvas-dim); margin-top:2px;}

.card{
  position:relative; background:var(--canvas); color:var(--ink); border-radius:6px;
  border:1.5px dashed var(--thread); padding:14px 14px 12px; overflow:hidden;
  transition: transform 0.15s ease;
}
.card.done{background:var(--canvas-dim);}
.card:hover{transform:translateY(-2px);}
.card-top{display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
.peak-icon{flex-shrink:0; opacity:0.85;}
.card-name{font-family:'Oswald',sans-serif; font-size:15.5px; font-weight:600; line-height:1.2; margin:0;}
.card-place{font-size:11.5px; color:var(--ink-soft); font-style:italic; margin:3px 0 10px;}
.card-bottom{display:flex; justify-content:space-between; align-items:center;}
.masl{font-family:'JetBrains Mono',monospace; font-size:16px; font-weight:600;}
.masl small{font-size:10px; font-weight:400; color:var(--ink-soft);}
.diff-pill{font-size:10px; text-transform:uppercase; letter-spacing:0.02em; padding:3px 8px; border-radius:20px; font-weight:600;}
.toggle-btn{
  width:100%; margin-top:10px; padding:7px 0; font-family:'Oswald',sans-serif; font-size:12px; text-transform:uppercase;
  letter-spacing:0.03em; border-radius:3px; cursor:pointer; border:1px solid var(--thread); background:transparent; color:var(--ink); font-weight:600;
}
.card.done .toggle-btn{ background:var(--moss-d); color:var(--canvas); border-color:var(--moss-d); }
.climb-date{font-size:11px; color:var(--ink-soft); margin-top:7px; text-align:center;}
.climb-date a{color:var(--rust); text-decoration:underline; cursor:pointer;}
.stamp{
  position:absolute; top:8px; right:-26px; transform:rotate(28deg); background:rgba(181,80,46,0.9); color:#fff3e9;
  font-family:'Oswald',sans-serif; font-size:10px; font-weight:700; letter-spacing:0.06em; padding:3px 30px;
  pointer-events:none;
}
.timeline{background:var(--bg-raised); border-radius:8px; padding:4px 20px; border:1px solid rgba(242,233,208,0.1); margin-top:30px;}
.timeline-row{display:grid; grid-template-columns:10px 100px 1fr auto; align-items:center; gap:12px; padding:11px 0; border-bottom:1px solid rgba(242,233,208,0.08); font-size:13px;}
.timeline-row:last-child{border-bottom:none;}
.timeline-dot{width:9px; height:9px; border-radius:50%;}
.timeline-date{color:var(--canvas-dim); font-size:11.5px;}
.timeline-name{font-weight:600; color:var(--canvas);}
.timeline-place{color:var(--canvas-dim); font-size:11.5px; text-align:right;}

.stats-grid{display:grid; grid-template-columns:1fr 1fr; gap:28px; background:var(--bg-raised); border-radius:8px; padding:22px; margin-top:10px; border:1px solid rgba(242,233,208,0.1);}
.stats-col h4{font-family:'Oswald',sans-serif; font-size:12.5px; color:var(--canvas-dim); text-transform:uppercase; letter-spacing:0.05em; margin:0 0 12px;}
.stat-row{display:grid; grid-template-columns:96px 1fr 96px; align-items:center; gap:10px; margin-bottom:10px;}
.stat-label{color:var(--canvas); font-weight:600; font-size:12px;}
.stat-bar-track{background:rgba(242,233,208,0.1); border-radius:20px; height:9px; overflow:hidden;}
.stat-bar-fill{height:100%; border-radius:20px; transition:width 0.3s ease;}
.stat-value{color:var(--canvas-dim); text-align:right; font-size:10.5px;}
@media (max-width:600px){ .stats-grid{grid-template-columns:1fr;} }

.rank-wrap{background:var(--bg-raised); border-radius:6px; padding:6px 0; margin-top:10px;}
.rank-row{display:grid; grid-template-columns:40px 1fr 90px 110px; align-items:center; gap:6px; padding:10px 16px; font-size:14px; border-bottom:1px solid rgba(242,233,208,0.08);}
.rank-row.head{color:var(--canvas-dim); font-size:11px; text-transform:uppercase; letter-spacing:0.04em; border-bottom:1px solid rgba(242,233,208,0.18);}
.rank-row.me{background:rgba(197,151,45,0.14);}
.rank-num{font-family:'Oswald',sans-serif; font-weight:700; color:var(--gold);}
.rank-name{font-weight:600;}
.rank-count, .rank-elev{font-family:'JetBrains Mono',monospace; font-size:13px; color:var(--canvas-dim); text-align:right;}
.empty{padding:30px 16px; text-align:center; color:var(--canvas-dim); font-size:13px;}

.settings-row{margin-top:30px; display:flex; gap:14px; align-items:center; font-size:12px; color:var(--canvas-dim);}
.settings-row a{color:var(--rust); cursor:pointer; text-decoration:underline;}

.edit-link{font-size:11px; color:var(--thread); text-decoration:underline; cursor:pointer; align-self:center;}
.card.editing{border-color:var(--rust); border-style:solid;}
.edit-field{margin-bottom:8px;}
.edit-field label{display:block; font-size:10px; text-transform:uppercase; letter-spacing:0.04em; color:var(--ink-soft); margin-bottom:3px;}
.edit-field input, .edit-field select{width:100%; padding:6px 8px; font-size:13px; border:1px solid var(--thread); border-radius:3px; background:#fffdf4; color:var(--ink); font-family:'Inter',sans-serif;}
.edit-actions{display:flex; gap:8px; margin-top:6px;}
.edit-actions .btn{flex:1; padding:7px 0; font-size:11px;}
.edit-actions .toggle-btn{flex:1; margin-top:0;}
.edit-note{font-size:12px; color:var(--canvas-dim); margin:-4px 0 18px;}

.modal-box textarea{width:100%; padding:9px 12px; font-size:13px; border:1px solid var(--thread); border-radius:3px; background:#fffdf4; color:var(--ink); font-family:'Inter',sans-serif; margin-bottom:12px; resize:vertical;}
.modal-field-label{display:block; font-size:10px; text-transform:uppercase; letter-spacing:0.04em; color:var(--ink-soft); margin-bottom:4px;}
.modal-box input[type=file]{margin-bottom:10px; font-size:12px; width:100%;}
.modal-photo-preview{max-width:100%; border-radius:4px; display:block; margin-bottom:6px;}
.climb-meta{margin-top:8px; display:flex; align-items:flex-start; gap:8px;}
.climb-photo-thumb{width:36px; height:36px; border-radius:4px; object-fit:cover; flex-shrink:0; border:1px solid var(--thread); cursor:pointer;}
.climb-notes{font-size:11px; color:var(--ink-soft); font-style:italic; line-height:1.4; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;}
.photo-lightbox{position:fixed; inset:0; background:rgba(10,14,10,0.85); display:flex; align-items:center; justify-content:center; z-index:110; padding:24px; cursor:zoom-out;}
.photo-lightbox img{max-width:90vw; max-height:85vh; border-radius:6px;}

@media (max-width: 640px){
  .wrap{padding:18px 14px 60px;}
  .topbar{flex-direction:column; align-items:flex-start; gap:12px; margin-bottom:16px;}
  .brand{font-size:18px;}
  .tabs{width:100%; gap:6px;}
  .tab-btn{flex:1; padding:9px 6px; font-size:11.5px; text-align:center;}

  .hero-stats{gap:20px;}
  .hero-num{font-size:32px;}
  .hero-num.hero-elev{font-size:24px;}
  .hero-num sub{font-size:14px;}

  .namebar{flex-wrap:wrap; margin-bottom:16px;}

  .controls-row{flex-direction:column; align-items:stretch;}
  .controls-row input[type=text], .controls-row select{width:100%; min-width:0;}

  .grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:10px;}
  .card{padding:12px 12px 10px;}
  .card-name{font-size:14px;}
  .masl{font-size:14px;}

  .wall-grid{grid-template-columns:repeat(auto-fill,minmax(92px,1fr)); gap:14px; padding:16px;}

  .stats-grid{padding:16px 14px; gap:20px;}
  .stat-row{grid-template-columns:64px 1fr 76px; gap:6px;}
  .stat-label{font-size:10.5px;}
  .stat-value{font-size:9.5px;}

  .timeline{padding:2px 14px;}
  .timeline-row{grid-template-columns:8px 1fr auto; grid-template-areas:"dot date place" "dot name name"; row-gap:2px; padding:10px 0;}
  .timeline-dot{grid-area:dot;}
  .timeline-date{grid-area:date; font-size:10.5px;}
  .timeline-name{grid-area:name; font-size:12.5px;}
  .timeline-place{grid-area:place; font-size:10.5px;}

  .rank-row{grid-template-columns:26px 1fr 56px 74px; gap:6px; padding:9px 12px; font-size:12.5px;}
  .rank-count, .rank-elev{font-size:11px;}

  .onboard{margin:34px auto; padding:26px 20px;}

  .modal-box{padding:20px;}
  .modal-actions{flex-direction:column-reverse;}
  .modal-actions .btn, .modal-actions .toggle-btn{width:100%;}

  .celebration-card{padding:20px 22px;}
  .celebration-title{font-size:17px;}

  .edit-actions{flex-direction:column;}
  .edit-actions .btn, .edit-actions .toggle-btn{flex:none; width:100%;}

  .wall-actions{flex-direction:column; align-items:stretch;}
  .wall-actions .toggle-btn, .wall-actions .btn{width:100%;}

  .settings-row{flex-wrap:wrap;}
}
</style>
</head>

function parseMaslNum(raw){
  const cleaned = String(raw).replace(/[~\s]/g,"").replace(/(\d),(\d)/g,"$1$2");
  const nums = (cleaned.match(/\d+/g)||[]).map(Number);
  if(nums.length===0) return 0;
  if(nums.length>=2) return Math.round((nums[0]+nums[1])/2);
  return nums[0];
}

const DIFFICULTY_OPTIONS = ["Beginner","Beginner to moderate","Moderate","Moderate to difficult","Difficult","Very difficult"];

const CAT = (diff)=>{
  const d = diff.toLowerCase();
  if(d.includes("very difficult")) return {label:"Very difficult", fill:"var(--brick)", dk:"var(--brick-d)"};
  if(d==="difficult") return {label:"Difficult", fill:"var(--rust)", dk:"var(--rust-d)"};

};

function hashId(s){
  let h = 0;
  for(let i=0;i<s.length;i++){ h = (h*31 + s.charCodeAt(i)) | 0; }
  return Math.abs(h);
}

function badgeSVG(m, size){
  size = size || 52;
  const c = CAT(m.difficulty);
  const globalMax = Math.max(...MOUNTAINS.map(x=>x.maslNum), 1);
  const hFrac = 0.35 + 0.65 * Math.sqrt(m.maslNum / globalMax);
  const baseY = 46;
  const iconic = ICONIC_SHAPES[m.legacyId];
  let shapeMarkup;
  if(iconic){
    const extra = iconic.extra ? iconic.extra.replace(/CURRENT_DK/g, c.dk).replace(/CURRENT_FILL/g, c.fill) : "";
    shapeMarkup = `<g transform="translate(32,${baseY}) scale(1,${hFrac.toFixed(3)}) translate(-32,-${baseY})">
      <path d="${iconic.path}" style="fill:${c.fill}; stroke:${c.dk}; stroke-width:1"/>
      ${extra}
    </g>`;
  } else {
    const topY = baseY - hFrac*30, midY = baseY - hFrac*20;
    const jitter = (hashId(m.id+m.name) % 9) - 4;
    const midX = 32 + jitter, leftX = 8, rightX = 56;
    const snow = m.maslNum >= 2500;
    shapeMarkup = `<path d="M${leftX} ${baseY} L${(midX-10).toFixed(1)} ${midY.toFixed(1)} L${midX} ${topY.toFixed(1)} L${(midX+10).toFixed(1)} ${midY.toFixed(1)} L${rightX} ${baseY} Z" style="fill:${c.fill}; stroke:${c.dk}; stroke-width:1"/>
    ${snow ? `<path d="M${midX-4} ${(topY+5).toFixed(1)} L${midX} ${topY.toFixed(1)} L${midX+4} ${(topY+5).toFixed(1)} Z" style="fill:#f2e9d0"/>` : ``}`;
  }
  return `<svg width="${size}" height="${size}" viewBox="0 0 64 64" aria-hidden="true">
    <circle cx="32" cy="32" r="29" style="fill:var(--canvas); stroke:${c.fill}; stroke-width:4"/>
    ${shapeMarkup}
    <text x="32" y="58" text-anchor="middle" style="font-family:'JetBrains Mono',monospace; font-size:8px; font-weight:600; fill:${c.dk};">${m.maslNum}</text>
  </svg>`;
}

const HEX = {
  bg:"#202b21", canvas:"#f2e9d0", canvasDim:"#c9bd97",
  moss:"#6b8f5c", mossD:"#35401e", teal:"#4f8f81", tealD:"#1e3730",
  gold:"#c9a227", goldD:"#4a3a0c", amber:"#c2791f", amberD:"#4a2c07",
  rust:"#b5502e", rustD:"#481f10", brick:"#8b3a3a", brickD:"#3a1414"
};
function CAT_HEX(diff){
  const d = diff.toLowerCase();
  if(d.includes("very difficult")) return {fill:HEX.brick, dk:HEX.brickD};
  if(d==="difficult") return {fill:HEX.rust, dk:HEX.rustD};
  if(d.includes("moderate to difficult")) return {fill:HEX.amber, dk:HEX.amberD};
  if(d==="moderate") return {fill:HEX.gold, dk:HEX.goldD};
  if(d.includes("beginner to moderate")) return {fill:HEX.teal, dk:HEX.tealD};
  return {fill:HEX.moss, dk:HEX.mossD};
}
function truncateName(s, n){ return s.length > n ? s.slice(0, n-1)+"…" : s; }

function exportBadgeGroup(m, cx, cy){
  const c = CAT_HEX(m.difficulty);
  const globalMax = Math.max(...MOUNTAINS.map(x=>x.maslNum), 1);
  const hFrac = 0.35 + 0.65 * Math.sqrt(m.maslNum / globalMax);
  const r = 46;
  const iconic = ICONIC_SHAPES[m.legacyId];
  let shapeMarkup;
  if(iconic){
    const k = r/29;
    const extra = iconic.extra ? iconic.extra.replace(/CURRENT_DK/g, c.dk).replace(/CURRENT_FILL/g, c.fill) : "";
    shapeMarkup = `<g transform="translate(${cx},${cy}) scale(${k.toFixed(3)}) translate(-32,-32)">
      <g transform="translate(32,46) scale(1,${hFrac.toFixed(3)}) translate(-32,-46)">
        <path d="${iconic.path}" fill="${c.fill}" stroke="${c.dk}" stroke-width="1"/>
        ${extra}
      </g>
    </g>`;
  } else {
    const baseY = cy+30, topY = cy+30-hFrac*46, midY = cy+30-hFrac*30;
    const jitter = (hashId(m.id+m.name) % 13) - 6;
    const midX = cx+jitter, leftX = cx-40, rightX = cx+40;
    const snow = m.maslNum >= 2500;
    shapeMarkup = `<path d="M${leftX} ${baseY} L${(midX-16).toFixed(1)} ${midY.toFixed(1)} L${midX.toFixed(1)} ${topY.toFixed(1)} L${(midX+16).toFixed(1)} ${midY.toFixed(1)} L${rightX} ${baseY} Z" fill="${c.fill}" stroke="${c.dk}" stroke-width="1.5"/>
    ${snow ? `<path d="M${(midX-6).toFixed(1)} ${(topY+8).toFixed(1)} L${midX.toFixed(1)} ${topY.toFixed(1)} L${(midX+6).toFixed(1)} ${(topY+8).toFixed(1)} Z" fill="#f2e9d0"/>` : ``}`;
  }
  return `
  <circle cx="${cx}" cy="${cy}" r="${r}" fill="${HEX.canvas}" stroke="${c.fill}" stroke-width="6"/>
  ${shapeMarkup}
  <text x="${cx}" y="${cy+42}" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" font-weight="600" fill="${c.dk}">${m.maslNum}</text>
  <text x="${cx}" y="${cy+70}" text-anchor="middle" font-family="Oswald, sans-serif" font-size="13" font-weight="600" fill="${HEX.canvas}">${esc(truncateName(m.name,18))}</text>`;
}

function buildWallExportSVG(){
  const done = MOUNTAINS.filter(m=>state.hiked.has(m.id)).sort((a,b)=>b.maslNum-a.maslNum);
  const cols = Math.max(1, Math.min(5, done.length));
  const cellW = 160, cellH = 176, padX = 40, padTop = 130, padBottom = 40;
  const rows = Math.ceil(done.length / cols) || 1;
  const width = cols*cellW + padX*2;
  const height = padTop + rows*cellH + padBottom;
  const totalElev = done.reduce((s,m)=>s+m.maslNum,0);
  let badges = "";
  done.forEach((m,i)=>{
    const col = i % cols, row = Math.floor(i/cols);
    const cx = padX + col*cellW + cellW/2;
    const cy = padTop + row*cellH + 50;
    badges += exportBadgeGroup(m, cx, cy);
  });
  return `<svg xmlns="http://www.w3.org/2000/svg" width="${width}" height="${height}" viewBox="0 0 ${width} ${height}">
    <rect width="${width}" height="${height}" fill="${HEX.bg}"/>
    <text x="${padX}" y="52" font-family="Oswald, sans-serif" font-size="26" font-weight="700" fill="${HEX.canvas}" letter-spacing="1">SUMMIT LOG · ${esc(state.profile ? state.profile.display_name : "")}</text>
    <text x="${padX}" y="80" font-family="JetBrains Mono, monospace" font-size="14" fill="${HEX.canvasDim}">${done.length} peaks badged · ${totalElev.toLocaleString()} masl climbed</text>
    ${badges}
  </svg>`;
}

function checkMilestones(){
  const milestones = [5,10,25,50,75,100];
  const count = state.hiked.size;
  if(milestones.includes(count) && !celebrated.has("count-"+count)){
    celebrated.add("count-"+count);
    saveCelebrated();
    showCelebration(`${count} peaks badged!`, "Keep the streak going.");
    return;
  }
  if(count === MOUNTAINS.length && MOUNTAINS.length > 0 && !celebrated.has("all")){
    celebrated.add("all");
    saveCelebrated();
    showCelebration("Every mountain on the list!", "You've badged all of them.");
    return;
  }
  for(const cat of GROUP_ORDER){
    const list = MOUNTAINS.filter(m => CAT(m.difficulty).label === cat);
    if(list.length === 0) continue;
    const key = "cat-"+cat;
    if(!celebrated.has(key) && list.every(m => state.hiked.has(m.id))){
      celebrated.add(key);
      saveCelebrated();
      showCelebration(`All ${cat} peaks done!`, `Every ${cat.toLowerCase()} mountain, badged.`);
      return;
    }
  }
}

async function handleModalConfirm(){
  const modal = state.modal;
  if(!modal) return;

  if(modal.kind === "prompt" && modal.action === "rename"){
    const inputEl = document.getElementById("modal-input");
    const value = inputEl ? inputEl.value.trim() : "";
    if(value && value !== state.profile.display_name){
      const { error } = await sb.from("profiles").update({ display_name: value }).eq("id", state.user.id);
      if(error){ showToast("Could not rename: "+error.message); }
      else{
        state.profile.display_name = value;
        await loadLeaderboard();
      }
    }

  } else if(modal.kind === "password" && modal.action === "change-password"){
    const inputEl = document.getElementById("modal-input");
    const value = inputEl ? inputEl.value : "";
    if(!value || value.length < 6){ state.authError = "Password must be at least 6 characters."; render(); return; }
    const { error } = await sb.auth.updateUser({ password: value });
    state.authError = null;
    if(error){ showToast("Could not change password: "+error.message); }
    else{ showToast("Password updated."); }

  } else if(modal.kind === "date" && (modal.action === "mark-hiked" || modal.action === "edit-date")){
    const inputEl = document.getElementById("modal-input");
    const dateVal = inputEl ? inputEl.value : "";
    const notesEl = document.getElementById("modal-notes");
    const notesVal = notesEl ? notesEl.value.trim() : "";
    const photoInput = document.getElementById("modal-photo");
    const file = photoInput && photoInput.files && photoInput.files[0];

    let photoUrl = modal.removePhoto ? null : (modal.photoUrlDefault || null);
    if(file){
      const upload = await uploadClimbPhoto(modal.payload, file);
      if(upload.error){ showToast("Could not upload photo: "+upload.error.message); return; }
      photoUrl = upload.url;
    }

    const fields = { climbed_on: dateVal || null, notes: notesVal || null, photo_url: photoUrl };
    let error;
    if(modal.action === "mark-hiked"){
      ({ error } = await sb.from("climbs").upsert({ user_id: state.user.id, mountain_id: modal.payload, ...fields }, { onConflict: "user_id,mountain_id" }));
    } else {
      ({ error } = await sb.from("climbs").update(fields).eq("user_id", state.user.id).eq("mountain_id", modal.payload));
    }
    if(error){ showToast("Could not save that climb: "+error.message); return; }

    state.hiked.add(modal.payload);
    state.hikedDates[modal.payload] = fields.climbed_on;
    state.hikedNotes[modal.payload] = fields.notes;
    state.hikedPhotos[modal.payload] = fields.photo_url;
    await loadLeaderboard();
    state.modal = null;
    render();
    if(modal.action === "mark-hiked") checkMilestones();
    return;

  } else if(modal.action === "unmark"){
    const { error } = await sb.from("climbs").delete().eq("user_id", state.user.id).eq("mountain_id", modal.payload);
    if(!error){
      state.hiked.delete(modal.payload);
      delete state.hikedDates[modal.payload];
      delete state.hikedNotes[modal.payload];
      delete state.hikedPhotos[modal.payload];
      await loadLeaderboard();
    } else showToast("Could not remove badge: "+error.message);

  } else if(modal.action === "delete-mountain"){
    const id = modal.payload;
    const { error } = await sb.from("mountains").delete().eq("id", id);
    if(!error){
      MOUNTAINS = MOUNTAINS.filter(x=>x.id!==id);
      state.hiked.delete(id);
      delete state.hikedDates[id];
      delete state.hikedNotes[id];
      delete state.hikedPhotos[id];
      await loadLeaderboard();
    } else showToast("Could not delete: "+error.message);
    state.editingId = null;

  } else if(modal.action === "reset-log"){
    const { error } = await sb.from("climbs").delete().eq("user_id", state.user.id);
    if(!error){
      state.hiked = new Set();
      state.hikedDates = {};
      state.hikedNotes = {};
      state.hikedPhotos = {};
      await loadLeaderboard();
    } else showToast("Could not reset: "+error.message);
  }
  state.modal = null;
  render();
}

async function copySummary(){

  try{
    await navigator.clipboard.writeText(text);
    showToast("Copied to clipboard!");
  }catch(e){
    try{
      const ta = document.createElement("textarea");
      ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      document.execCommand("copy");
      document.body.removeChild(ta);
      showToast("Copied to clipboard!");
    }catch(e2){
      showToast(text);
    }
  }
}

function downloadWallImage(){
  const done = MOUNTAINS.filter(m=>state.hiked.has(m.id));
  if(done.length === 0){ showToast("Badge a mountain first to make an image."); return; }
  const svgStr = buildWallExportSVG();
  const svgBlob = new Blob([svgStr], {type:"image/svg+xml;charset=utf-8"});
  const url = URL.createObjectURL(svgBlob);
  const img = new Image();
  img.onload = ()=>{
    const scale = 2;
    const canvas = document.createElement("canvas");
    canvas.width = img.width * scale;
    canvas.height = img.height * scale;
    const ctx = canvas.getContext("2d");
    ctx.scale(scale, scale);
    ctx.drawImage(img, 0, 0);
    URL.revokeObjectURL(url);
    canvas.toBlob((blob)=>{
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "summit-log-badge-wall.png";
      a.click();
    }, "image/png");
  };
  img.onerror = ()=>{ URL.revokeObjectURL(url); showToast("Couldn't generate the image — try copy summary instead."); };
  img.src = url;
}

// ---- Leaderboard: aggregate every user's climbs client-side ----
async function loadLeaderboard(){
  const { data, error } = await sb
    .from("climbs")
    .select("user_id, created_at, mountains(masl_num, place), profiles(display_name)");
  if(error){ state.leaderboard = []; return; }
  const byUser = {};
  (data||[]).forEach(row=>{
    const uid = row.user_id;
    if(!byUser[uid]){
      byUser[uid] = { userId:uid, name: row.profiles ? row.profiles.display_name : "Hiker", count:0, elev:0, regionCounts:{}, regionElev:{}, updated:0 };
    }
    const entry = byUser[uid];
    entry.count++;
    const masl = row.mountains ? row.mountains.masl_num : 0;
    entry.elev += masl;
    const region = row.mountains ? inferRegion(row.mountains.place) : "Other";
    entry.regionCounts[region] = (entry.regionCounts[region]||0)+1;
    entry.regionElev[region] = (entry.regionElev[region]||0)+masl;
    const t = new Date(row.created_at).getTime();
    if(t > entry.updated) entry.updated = t;
  });
  const list = Object.values(byUser);
  list.sort((a,b)=> (b.count-a.count) || (b.elev-a.elev));
  state.leaderboard = list;
}

async function uploadClimbPhoto(mountainId, file){
  const ext = (file.name.split(".").pop() || "jpg").toLowerCase().replace(/[^a-z0-9]/g,"") || "jpg";
  const path = `${state.user.id}/${mountainId}.${ext}`;
  const { error: upErr } = await sb.storage.from("climb-photos").upload(path, file, { upsert: true });
  if(upErr) return { error: upErr };
  const { data } = sb.storage.from("climb-photos").getPublicUrl(path);
  return { url: data.publicUrl + "?t=" + Date.now() };
}

function buildRidgeSVG(){
  if(MOUNTAINS.length === 0){
    return `<svg viewBox="0 0 900 200" xmlns="http://www.w3.org/2000/svg"></svg>`;
  }
  const sorted = [...MOUNTAINS].sort((a,b)=>b.maslNum-a.maslNum);
  const n = sorted.length;
  const arranged = new Array(n);
  let left = Math.floor((n-1)/2), right = left+1, goLeft = true;
  for(const m of sorted){
    if(goLeft){ arranged[left]=m; left--; } else { arranged[right]=m; right++; }
    goLeft = !goLeft;
  }
  const W = 900, H = 200, base = 190, maxH = 150;
  const maxMasl = sorted[0].maslNum;
  const pts = arranged.map((m,i)=>{
    const x = (i/(n-1))*W;
    const y = base - (m.maslNum/maxMasl)*maxH;
    return {x, y, m};
  });
  const poly = "0,"+base+" " + pts.map(p=>p.x.toFixed(1)+","+p.y.toFixed(1)).join(" ") + " "+W+","+base;
  let flags = "";
  pts.forEach(p=>{
    if(state.hiked.has(p.m.id)){
      flags += `<g transform="translate(${p.x.toFixed(1)},${(p.y-1).toFixed(1)})">
        <line x1="0" y1="0" x2="0" y2="-16" stroke="#f2e9d0" stroke-width="1.2"/>
        <path d="M0,-16 L9,-12.5 L0,-9 Z" fill="#b5502e"/>
      </g>`;
    }
  });
  return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">
    <polygon points="${poly}" fill="#324a2c" stroke="#4a6a3f" stroke-width="1"/>
    ${flags}
  </svg>`;
}

const REGION_MAP = [
  ["Luzon", ["benguet","nueva vizcaya","ifugao","kalinga","mountain province","cagayan","zambales","tarlac","pampanga","bulacan","rizal","laguna","batangas","cavite","quezon","bataan","camarines","albay","sorsogon","mindoro","palawan","bicol"]],
  ["Visayas", ["cebu","negros","iloilo","antique","aklan","capiz","leyte","samar","siquijor","bohol","romblon"]],
  ["Mindanao", ["davao","cotabato","bukidnon","zamboanga","misamis","agusan","surigao","camiguin","lanao","maguindanao","sarangani","sultan kudarat"]]
];
function inferRegion(place){
  const p = String(place).toLowerCase();
  for(const [region, keys] of REGION_MAP){
    if(keys.some(k=>p.includes(k))) return region;
  }
  return "Other";
}

function getFiltered(){
  const q = state.search.trim().toLowerCase();
  let list = MOUNTAINS.slice();
  if(state.region !== "all") list = list.filter(m => inferRegion(m.place) === state.region);
  if(state.status === "hiked") list = list.filter(m => state.hiked.has(m.id));
  else if(state.status === "not-yet") list = list.filter(m => !state.hiked.has(m.id));
  if(q) list = list.filter(m => m.name.toLowerCase().includes(q) || m.place.toLowerCase().includes(q));
  return list;
}

const PAGE_SIZE = 12;

function renderLog(){
  const filtered = getFiltered();
  let body = "";
  if(filtered.length === 0){
    const msg = state.search.trim() ? `No mountains match "${esc(state.search)}".`
      : state.status === "hiked" ? "You haven't badged any mountains in this region yet."
      : state.status === "not-yet" ? "Nothing left here — you've badged every mountain matching these filters."
      : "No mountains match these filters.";
    body = `<div class="no-results">${msg}</div>`;
  } else if(state.sort === "groups"){
    const groups = {};
    filtered.forEach(m=>{
      const cat = CAT(m.difficulty).label;
      (groups[cat] = groups[cat]||[]).push(m);
    });
    const isSearching = state.search.trim().length > 0;
    const presentCats = GROUP_ORDER.filter(cat=>groups[cat]);
    const allExpanded = presentCats.length > 0 && presentCats.every(cat=>state.expandedGroups.has(cat));
    body += `<div class="expand-all-row"><a data-action="toggle-expand-all">${allExpanded ? "Collapse all" : "Expand all"}</a></div>`;
    presentCats.forEach(cat=>{
      const list = groups[cat];
      list.sort((a,b)=>b.maslNum-a.maslNum);
      const c = CAT(cat);
      const doneInGroup = list.filter(m=>state.hiked.has(m.id)).length;
      const expanded = isSearching || state.expandedGroups.has(cat);
      const visibleCount = state.visibleCounts["group:"+cat] || PAGE_SIZE;
      const visibleList = list.slice(0, visibleCount);
      const remaining = list.length - visibleList.length;
      body += `<div class="group">
        <div class="group-head" data-action="toggle-group" data-group="${esc(cat)}">
          <span class="swatch" style="background:${c.fill}"></span>
          <h3>${cat}</h3>
          <span class="count">${doneInGroup}/${list.length} badged</span>
          <span class="group-chevron">${expanded ? "▲" : "▼"}</span>
        </div>
        ${expanded ? `
          <div class="grid">
            ${visibleList.map(m=>cardHTML(m)).join("")}
          </div>
          ${remaining > 0 ? `<button class="btn load-more-btn" data-action="load-more-group" data-group="${esc(cat)}">Show ${Math.min(PAGE_SIZE, remaining)} more (${remaining} left)</button>` : ``}
        ` : ``}
      </div>`;
    });
  } else {
    const list = filtered.slice();
    if(state.sort === "elev-desc") list.sort((a,b)=>b.maslNum-a.maslNum);
    else if(state.sort === "elev-asc") list.sort((a,b)=>a.maslNum-b.maslNum);
    else if(state.sort === "name-asc") list.sort((a,b)=>a.name.localeCompare(b.name));
    const visibleCount = state.visibleCounts["flat"] || PAGE_SIZE;
    const visibleList = list.slice(0, visibleCount);
    const remaining = list.length - visibleList.length;
    body = `<div class="grid">${visibleList.map(m=>cardHTML(m)).join("")}</div>
      ${remaining > 0 ? `<button class="btn load-more-btn" data-action="load-more-flat">Show ${Math.min(PAGE_SIZE, remaining)} more (${remaining} left)</button>` : ``}`;
  }
  return renderControls() + renderAddMountainSection() + body;
}

const REGION_ORDER = ["Luzon","Visayas","Mindanao","Other"];
const REGION_COLOR = {Luzon:"var(--moss)", Visayas:"var(--teal)", Mindanao:"var(--rust)", Other:"var(--thread)"};

function computeStats(){
  const done = MOUNTAINS.filter(m=>state.hiked.has(m.id));
  const byRegion = {}, byDiff = {};
  done.forEach(m=>{
    const r = inferRegion(m.place);
    byRegion[r] = byRegion[r] || {count:0, elev:0};
    byRegion[r].count++; byRegion[r].elev += m.maslNum;
    const cat = CAT(m.difficulty).label;
    byDiff[cat] = byDiff[cat] || {count:0, elev:0};
    byDiff[cat].count++; byDiff[cat].elev += m.maslNum;
  });
  return {byRegion, byDiff};
}

function renderBarRows(dataObj, orderList, colorFn){
  const entries = orderList.filter(k=>dataObj[k]).map(k=>({key:k, ...dataObj[k]}));
  if(entries.length === 0) return `<p style="font-size:12px; color:var(--canvas-dim);">Nothing here yet.</p>`;
  const maxElev = Math.max(...entries.map(e=>e.elev), 1);
  return entries.map(e=>{
    const pct = Math.max(6, Math.round((e.elev/maxElev)*100));
    return `<div class="stat-row">
      <div class="stat-label">${esc(e.key)}</div>
      <div class="stat-bar-track"><div class="stat-bar-fill" style="width:${pct}%; background:${colorFn(e.key)};"></div></div>
      <div class="stat-value mono">${e.count} pk · ${e.elev.toLocaleString()} m</div>
    </div>`;
  }).join("");
}

function renderStats(){
  const {byRegion, byDiff} = computeStats();
  return `
  <h3 style="margin:30px 0 4px;">My climbing breakdown</h3>
  <p style="font-size:13px; color:var(--canvas-dim); margin:0 0 4px;">Elevation climbed, by region and by difficulty.</p>
  <div class="stats-grid">
    <div class="stats-col">
      <h4>By region</h4>
      ${renderBarRows(byRegion, REGION_ORDER, k=>REGION_COLOR[k]||"var(--thread)")}
    </div>
    <div class="stats-col">
      <h4>By difficulty</h4>
      ${renderBarRows(byDiff, GROUP_ORDER, k=>CAT(k).fill)}
    </div>
  </div>`;
}

function renderWall(){
  const done = MOUNTAINS.filter(m=>state.hiked.has(m.id)).sort((a,b)=>b.maslNum-a.maslNum);
  if(done.length === 0){
    return `<div class="empty">Your board is empty. Mark a mountain as hiked on the Trail log to add your first patch.</div>`;
  }
  const totalElev = done.reduce((s,m)=>s+m.maslNum,0);
  const timelineSorted = done.slice().sort((a,b)=>{
    const da = state.hikedDates[a.id], db = state.hikedDates[b.id];
    if(da && db) return db.localeCompare(da);
    if(da && !db) return -1;
    if(!da && db) return 1;
    return a.name.localeCompare(b.name);
  });
  return `
  <div class="wall-head">
    <h3>My badge wall</h3>
    <p>${done.length} peak${done.length!==1?'s':''} badged · ${totalElev.toLocaleString()} masl climbed total</p>
    <div class="wall-actions">
      <button class="btn" data-action="copy-summary">Copy my summary</button>
      <button class="toggle-btn" data-action="download-wall">Download as image</button>
    </div>
  </div>
  <div class="wall-grid">
    ${done.map(m=>`
      <div class="wall-badge">
        ${badgeSVG(m, 84)}
        <div class="wall-name">${esc(m.name)}</div>
        <div class="wall-place">${esc(m.place)}</div>
      </div>
    `).join("")}
  </div>
  ${renderStats()}
  <h3 style="margin:30px 0 4px;">Climb timeline</h3>
  <p style="font-size:13px; color:var(--canvas-dim); margin:0 0 4px;">Most recent climbs first. Add dates on any card to fill this in.</p>
  <div class="timeline">
    ${timelineSorted.map(m=>{
      const c = CAT(m.difficulty);
      const d = state.hikedDates[m.id];
      const photoUrl = state.hikedPhotos[m.id];
      const notesStr = state.hikedNotes[m.id];
      return `<div class="timeline-row">
        <div class="timeline-dot" style="background:${c.fill}"></div>
        <div class="timeline-date">${d ? esc(formatDate(d)) : "No date"} <a data-edit-date="${m.id}" style="font-size:10px; margin-left:2px;">edit</a></div>
        <div class="timeline-name">${photoUrl ? `<img class="climb-photo-thumb" style="width:20px; height:20px; vertical-align:middle; margin-right:6px;" src="${esc(photoUrl)}" data-view-photo="${esc(photoUrl)}">` : ``}${esc(m.name)}</div>
        <div class="timeline-place">${esc(m.place)}${notesStr ? `<br><span style="font-style:italic; opacity:0.8;">${esc(notesStr)}</span>` : ``}</div>
      </div>`;
    }).join("")}
  </div>`;
}

function renderRankings(){
  let rows = state.leaderboard.slice();
  if(state.rankActive === "month"){
    const cutoff = Date.now() - 30*24*60*60*1000;
    rows = rows.filter(r => r.updated && r.updated >= cutoff);
  }
  const region = state.rankRegion;
  let getCount, getElev;
  if(region === "all"){
    getCount = r => r.count || 0;
    getElev = r => r.elev || 0;
  } else {
    getCount = r => (r.regionCounts && r.regionCounts[region]) || 0;
    getElev = r => (r.regionElev && r.regionElev[region]) || 0;
    rows = rows.filter(r => getCount(r) > 0);
  }
  rows.sort((a,b) => (getCount(b)-getCount(a)) || (getElev(b)-getElev(a)));

  let body = "";
  if(rows.length === 0){
    body = `<div class="empty">${state.rankActive==='month' ? "No hikers logged a climb in the last 30 days." : "No hikers on the board yet. Be the first to badge a peak."}</div>`;
  } else {
    body = rows.map((r,i)=>`
      <div class="rank-row ${r.userId===state.user.id?'me':''}">
        <div class="rank-num">#${i+1}</div>
        <div class="rank-name">${esc(r.name)}</div>
        <div class="rank-count">${getCount(r)} peaks</div>
        <div class="rank-elev mono">${getElev(r).toLocaleString()} m</div>
      </div>`).join("");
  }
  return `
  <h3 style="margin-bottom:4px;">Summit register</h3>
  <p style="font-size:13px; color:var(--canvas-dim); margin:0 0 14px;">Ranked by number of mountains badged, then total elevation climbed.</p>
  <div class="controls-row">
    <select id="rank-region-select">
      <option value="all" ${region==='all'?'selected':''}>All regions</option>
      <option value="Luzon" ${region==='Luzon'?'selected':''}>Luzon</option>
      <option value="Visayas" ${region==='Visayas'?'selected':''}>Visayas</option>
      <option value="Mindanao" ${region==='Mindanao'?'selected':''}>Mindanao</option>
    </select>
    <select id="rank-active-select">
      <option value="all" ${state.rankActive==='all'?'selected':''}>All time</option>
      <option value="month" ${state.rankActive==='month'?'selected':''}>Active in the last 30 days</option>
    </select>
  </div>
  <div class="rank-wrap">
    <div class="rank-row head"><div>#</div><div>Hiker</div><div>Peaks</div><div>Elevation</div></div>
    ${body}
  </div>
  <div class="settings-row"><a data-action="reset">Reset my trail log</a></div>
  `;
}

function esc(s){ return String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

async function submitAuth(){
  const email = (document.getElementById("auth-email")||{}).value?.trim() || "";
  const password = (document.getElementById("auth-password")||{}).value || "";
  const isSignup = state.authMode === "signup";
  const displayName = isSignup ? ((document.getElementById("auth-display-name")||{}).value?.trim() || "") : "";
  if(!email || !password){ state.authError = "Enter an email and password."; render(); return; }
  if(isSignup && !displayName){ state.authError = "Enter a trail name."; render(); return; }

  state.authLoading = true; state.authError = null; render();

  if(isSignup){
    const { data, error } = await sb.auth.signUp({ email, password, options: { data: { display_name: displayName } } });
    if(error){ state.authError = error.message; state.authLoading = false; render(); return; }
    if(data.session){
      await handleSignedIn(data.user);
    } else {
      state.authLoading = false;
      state.authMode = "signin";
      state.authError = null;
      render();
      showToast("Check your email to confirm your account, then sign in.");
    }
  } else {
    const { data, error } = await sb.auth.signInWithPassword({ email, password });
    if(error){ state.authError = error.message; state.authLoading = false; render(); return; }
    await handleSignedIn(data.user);
  }
}

function switchAuthMode(mode){
  state.authMode = mode || (state.authMode === "signin" ? "signup" : "signin");
  state.authError = null;
  render();
}

async function requestPasswordReset(){
  const email = (document.getElementById("auth-email")||{}).value?.trim() || "";
  if(!email){ state.authError = "Enter your email."; render(); return; }
  state.authLoading = true; state.authError = null; render();
  const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: window.location.href.split("#")[0] });
  state.authLoading = false;
  if(error){ state.authError = error.message; render(); return; }
  state.authMode = "signin";
  render();
  showToast("Check your email for a password reset link.");
}

async function submitNewPassword(){
  const pw = (document.getElementById("auth-new-password")||{}).value || "";
  if(!pw || pw.length < 6){ state.authError = "Password must be at least 6 characters."; render(); return; }
  state.authLoading = true; state.authError = null; render();
  const { error } = await sb.auth.updateUser({ password: pw });
  state.authLoading = false;
  if(error){ state.authError = error.message; render(); return; }
  showToast("Password updated. You're signed in.");
  const { data: { session } } = await sb.auth.getSession();
  if(session && session.user){ await handleSignedIn(session.user); }
  else { state.authMode = "signin"; render(); }
}

async function signOutUser(){
  await sb.auth.signOut();
  state.user = null;
  state.profile = null;
  state.hiked = new Set();
  state.hikedDates = {};
  state.leaderboard = [];
  celebrated = new Set();
  state.view = "log";
  state.authMode = "signin";
  render();
}

async function handleSignedIn(user){
  state.user = user;
  state.loading = true;
  render();
  let { data: profile, error: fetchErr } = await sb.from("profiles").select("*").eq("id", user.id).single();
  if(!profile){
    const metaName = user.user_metadata && user.user_metadata.display_name;
    const fallbackName = metaName || (user.email || "Hiker").split("@")[0];
    const { data: created, error: createErr } = await sb.from("profiles").insert({ id: user.id, display_name: fallbackName }).select().single();
    if(createErr){ showToast("Could not create your profile: "+createErr.message); state.loading = false; render(); return; }
    profile = created;
  }
  state.profile = profile;
  celebrated = new Set(profile && profile.celebrated ? profile.celebrated : []);
  await loadMountains();
  await loadMyClimbs();
  await loadLeaderboard();
  state.authLoading = false;
  state.loading = false;
  render();
}

    state.search = e.target.value;

    render();
    const el = document.getElementById("search-input");

});

app.addEventListener("change", (e)=>{

    state.sort = e.target.value;
    state.visibleCounts = {};
    render();
  }
  if(e.target.id === "region-select"){
    state.region = e.target.value;
    state.visibleCounts = {};
    render();
  }
  if(e.target.id === "status-select"){
    state.status = e.target.value;
    state.visibleCounts = {};
    render();
  }
  if(e.target.id === "rank-region-select"){
    state.rankRegion = e.target.value;
    render();
  }
  if(e.target.id === "rank-active-select"){
    state.rankActive = e.target.value;
    render();

});

app.addEventListener("keydown", (e)=>{
  if(e.key === "Enter" && (e.target.id === "auth-email" || e.target.id === "auth-password" || e.target.id === "auth-display-name")){
    e.preventDefault();
    if(state.authMode === "reset") requestPasswordReset();
    else submitAuth();
  }
  if(e.key === "Enter" && e.target.id === "auth-new-password"){
    e.preventDefault();
    submitNewPassword();
  }
  if(e.key === "Enter" && e.target.id === "modal-input"){
    e.preventDefault();
    handleModalConfirm();
  }
});

app.addEventListener("click", async (e)=>{
  const submitAuthBtn = e.target.closest('[data-action="submit-auth"]');
  if(submitAuthBtn){ await submitAuth(); return; }

  const switchModeBtn = e.target.closest('[data-action="switch-auth-mode"]');
  if(switchModeBtn){ switchAuthMode(switchModeBtn.dataset.mode); return; }

  const submitResetBtn = e.target.closest('[data-action="submit-reset"]');
  if(submitResetBtn){ await requestPasswordReset(); return; }

  const submitNewPwBtn = e.target.closest('[data-action="submit-new-password"]');
  if(submitNewPwBtn){ await submitNewPassword(); return; }

  const signOutBtn = e.target.closest('[data-action="sign-out"]');
  if(signOutBtn){ await signOutUser(); return; }

  const toggleGroupBtn = e.target.closest('[data-action="toggle-group"]');
  if(toggleGroupBtn){
    const cat = toggleGroupBtn.dataset.group;
    if(state.expandedGroups.has(cat)) state.expandedGroups.delete(cat);
    else state.expandedGroups.add(cat);
    render();
    return;
  }

  const toggleExpandAllBtn = e.target.closest('[data-action="toggle-expand-all"]');
  if(toggleExpandAllBtn){
    const filtered = getFiltered();
    const cats = new Set(filtered.map(m=>CAT(m.difficulty).label));
    const allExpanded = Array.from(cats).every(c=>state.expandedGroups.has(c));
    state.expandedGroups = allExpanded ? new Set() : cats;
    render();
    return;
  }

  const loadMoreGroupBtn = e.target.closest('[data-action="load-more-group"]');
  if(loadMoreGroupBtn){
    const cat = loadMoreGroupBtn.dataset.group;
    const key = "group:"+cat;
    state.visibleCounts[key] = (state.visibleCounts[key] || PAGE_SIZE) + PAGE_SIZE;
    render();
    return;
  }

  const loadMoreFlatBtn = e.target.closest('[data-action="load-more-flat"]');
  if(loadMoreFlatBtn){
    state.visibleCounts["flat"] = (state.visibleCounts["flat"] || PAGE_SIZE) + PAGE_SIZE;
    render();
    return;
  }

  const tabBtn = e.target.closest("[data-tab]");
  if(tabBtn){ state.view = tabBtn.dataset.tab; render(); return; }

  const toggleBtn = e.target.closest("[data-toggle]");
  if(toggleBtn){
    const id = toggleBtn.dataset.toggle;
    const m = MOUNTAINS.find(x=>x.id===id);
    if(state.hiked.has(id)){
      state.modal = { kind:"confirm", message:`Remove your "${m ? m.name : "this"}" badge? This un-marks it as hiked.`, action:"unmark", payload:id, confirmLabel:"Remove badge" };
      render();
      return;
    }
    const today = new Date().toISOString().slice(0,10);
    state.modal = { kind:"date", message:`When did you climb "${m ? m.name : "this peak"}"? (optional)`, defaultValue:today, notesDefault:"", photoUrlDefault:null, action:"mark-hiked", payload:id, confirmLabel:"Add badge" };
    render();
    return;
  }

  const editDateLink = e.target.closest("[data-edit-date]");
  if(editDateLink){
    const id = editDateLink.dataset.editDate;
    const m = MOUNTAINS.find(x=>x.id===id);
    const current = state.hikedDates[id] || new Date().toISOString().slice(0,10);
    state.modal = { kind:"date", message:`Climb date for "${m ? m.name : "this peak"}"`, defaultValue:current, notesDefault:state.hikedNotes[id]||"", photoUrlDefault:state.hikedPhotos[id]||null, action:"edit-date", payload:id, confirmLabel:"Save" };
    render();
    return;
  }

  const showAdd = e.target.closest('[data-action="show-add-mountain"]');
  if(showAdd){ state.addingMountain = true; render(); return; }

  const cancelAdd = e.target.closest('[data-action="cancel-add-mountain"]');
  if(cancelAdd){ state.addingMountain = false; render(); return; }

  const saveAdd = e.target.closest('[data-action="save-add-mountain"]');
  if(saveAdd){
    const name = document.getElementById("add-name").value.trim();
    const place = document.getElementById("add-place").value.trim();
    const difficulty = document.getElementById("add-difficulty").value;
    const maslRaw = document.getElementById("add-masl").value.trim();
    if(!name || !maslRaw){ showToast("Please enter at least a name and elevation."); return; }
    const maslNum = parseMaslNum(maslRaw);
    const { data, error } = await sb.from("mountains").insert({
      name, place: place || "Philippines", difficulty, masl_num: maslNum, masl_raw: maslRaw, created_by: state.user.id
    }).select().single();
    if(error){ showToast("Could not add mountain: "+error.message); return; }
    MOUNTAINS.push({ id:data.id, legacyId:data.legacy_id, name:data.name, place:data.place, difficulty:data.difficulty, maslNum:data.masl_num, maslRaw:data.masl_raw });
    state.addingMountain = false;
    render();
    return;
  }

  const editLink = e.target.closest("[data-edit]");
  if(editLink){ state.editingId = editLink.dataset.edit; render(); return; }

  const cancelEdit = e.target.closest("[data-cancel-edit]");
  if(cancelEdit){ state.editingId = null; render(); return; }

  const saveEdit = e.target.closest("[data-save-edit]");
  if(saveEdit){
    const id = saveEdit.dataset.saveEdit;
    const card = saveEdit.closest(".card");
    const val = (f)=> card.querySelector(`[data-f="${f}"]`).value.trim();
    const name = val("name"), place = val("place"), difficulty = val("difficulty"), maslRaw = val("maslRaw");
    const m = MOUNTAINS.find(x=>x.id===id);
    if(m && name && place && maslRaw){
      const maslNum = parseMaslNum(maslRaw);
      const { error } = await sb.from("mountains")
        .update({ name, place, difficulty, masl_num: maslNum, masl_raw: maslRaw }).eq("id", id);
      if(error){ showToast("Could not save changes: "+error.message); }
      else{
        m.name = name; m.place = place; m.difficulty = difficulty; m.maslRaw = maslRaw; m.maslNum = maslNum;
      }
    }
    state.editingId = null;
    render();
    return;
  }

  const copyBtn = e.target.closest('[data-action="copy-summary"]');
  if(copyBtn){ await copySummary(); return; }

  const downloadBtn = e.target.closest('[data-action="download-wall"]');
  if(downloadBtn){ downloadWallImage(); return; }

  const deleteMountain = e.target.closest("[data-delete]");
  if(deleteMountain){
    const id = deleteMountain.dataset.delete;
    const m = MOUNTAINS.find(x=>x.id===id);
    if(!m) return;
    state.modal = { kind:"confirm", message:`Delete "${m.name}" from the list? This removes it for everyone, including anyone who already badged it.`, action:"delete-mountain", payload:id, confirmLabel:"Delete" };
    render();
    return;
  }

  const renameBtn = e.target.closest('[data-action="rename"]');
  if(renameBtn){
    state.modal = { kind:"prompt", message:"Enter a new trail name:", defaultValue:state.profile.display_name, action:"rename", confirmLabel:"Save name" };
    render();
    return;
  }

  const changePwBtn = e.target.closest('[data-action="change-password"]');
  if(changePwBtn){
    state.authError = null;
    state.modal = { kind:"password", message:"Enter a new password:", action:"change-password", confirmLabel:"Update password" };
    render();
    return;
  }

  const photoThumb = e.target.closest("[data-view-photo]");
  if(photoThumb){
    state.lightboxUrl = photoThumb.dataset.viewPhoto;
    render();
    return;
  }

  const lightboxBackdrop = e.target.closest(".photo-lightbox");
  if(lightboxBackdrop){
    state.lightboxUrl = null;
    render();
    return;
  }

  const resetBtn = e.target.closest('[data-action="reset"]');
  if(resetBtn){
    state.modal = { kind:"confirm", message:"This clears every badge you've earned. Continue?", action:"reset-log", confirmLabel:"Reset log" };
    render();
    return;
  }

  const clearDate = e.target.closest("[data-clear-date]");
  if(clearDate){
    const input = document.getElementById("modal-input");
    if(input) input.value = "";
    return;
  }

  const removePhoto = e.target.closest("[data-remove-photo]");
  if(removePhoto){
    if(state.modal){ state.modal.removePhoto = true; render(); }
    return;
  }

  const modalCancel = e.target.closest("[data-modal-cancel]");
  if(modalCancel){ state.modal = null; render(); return; }

  const modalBackdrop = e.target.closest("[data-modal-backdrop]");
  if(modalBackdrop && e.target === modalBackdrop){ state.modal = null; render(); return; }

  const modalConfirm = e.target.closest("[data-modal-confirm]");
  if(modalConfirm){ await handleModalConfirm(); return; }
});

(async function init(){
  state.loading = true;
  render();

  const isRecovery = window.location.hash.includes("type=recovery");
  if(isRecovery){
    state.authMode = "update-password";
    state.loading = false;
    render();
  } else {
    const { data: { session } } = await sb.auth.getSession();
    if(session && session.user){
      await handleSignedIn(session.user);
    } else {
      state.loading = false;
      render();
    }
  }

  sb.auth.onAuthStateChange(async (event, session) => {
    if(event === "PASSWORD_RECOVERY"){
      state.authMode = "update-password";
      state.loading = false;
      render();
      return;
    }
    if(event === "SIGNED_IN" && session && session.user && (!state.user || state.user.id !== session.user.id)){
      if(state.authMode === "update-password") return;
      await handleSignedIn(session.user);
    }
    if(event === "SIGNED_OUT"){
      state.user = null;
      state.profile = null;
      state.hiked = new Set();
      state.hikedDates = {};
      state.leaderboard = [];
      celebrated = new Set();
      state.view = "log";
      state.authMode = "signin";
      state.loading = false;
      render();
    }
  });
})();
</script>
