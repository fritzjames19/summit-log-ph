:root{
  --bg: #202b21;
  --bg-raised: #263323;
  --canvas: #f2e9d0;
  --canvas-dim: #e8dcb8;
  --ink: #2a2f22;
  --ink-soft: #5b5c47;
  --thread: #7c6a3f;
  --moss: #6b8f5c;
  --moss-d: #35401e;
  --teal: #4f8f81;
  --teal-d: #1e3730;
  --gold: #c9a227;
  --gold-d: #4a3a0c;
  --amber: #c2791f;
  --amber-d: #4a2c07;
  --rust: #b5502e;
  --rust-d: #481f10;
  --brick: #8b3a3a;
  --brick-d: #3a1414;
}
*{box-sizing:border-box;}
body{
  margin:0;
  background: var(--bg);
  color: var(--canvas);
  font-family:'Inter', sans-serif;
  overflow-x:hidden;
}
.wrap{max-width:980px;margin:0 auto;padding:28px 20px 80px;}
h1,h2,h3{font-family:'Oswald',sans-serif; text-transform:uppercase; letter-spacing:0.03em; margin:0;}
.mono{font-family:'JetBrains Mono', monospace;}
.topbar{display:flex; align-items:baseline; justify-content:space-between; flex-wrap:wrap; gap:10px; margin-bottom:20px; border-bottom:1px solid rgba(242,233,208,0.18); padding-bottom:14px;}
.brand{font-size:22px; font-weight:700; color:var(--canvas); display:flex; align-items:center; gap:10px;}
.brand-logo{width:34px; height:34px; display:block; flex-shrink:0;}
.brand span{color:var(--rust);}
.tabs{display:flex; gap:6px;}
.tab-btn{
  font-family:'Oswald',sans-serif; text-transform:uppercase; letter-spacing:0.03em; font-size:13px;
  background:transparent; color:var(--canvas-dim); border:1px solid rgba(242,233,208,0.25);
  padding:8px 16px; cursor:pointer; border-radius:3px; position:relative;
}
.tab-btn.active{ background:var(--canvas); color:var(--ink); border-color:var(--canvas); font-weight:600;}
.notif-badge{position:absolute; top:-7px; right:-7px; background:var(--rust); color:#fff3e9; font-size:10px; font-weight:700; min-width:16px; height:16px; padding:0 3px; border-radius:8px; display:flex; align-items:center; justify-content:center; line-height:1;}
.admin-tag{display:inline-block; background:var(--rust); color:#fff3e9; font-size:9.5px; font-weight:700; text-transform:uppercase; letter-spacing:0.04em; padding:2px 6px; border-radius:3px; vertical-align:middle; margin-left:2px;}
.report-link{background:none; border:none; cursor:pointer; font-size:11px; color:var(--ink-soft); font-family:'Inter',sans-serif; padding:4px 2px;}
.report-link:hover{color:var(--rust);}

.hero{margin:10px 0 26px;}
.hero-stats{display:flex; gap:28px; flex-wrap:wrap; align-items:flex-end; margin-bottom:14px;}
.hero-num{font-family:'Oswald',sans-serif; font-size:46px; font-weight:700; color:var(--canvas); line-height:1;}
.hero-num.hero-elev{font-size:32px;}
.hero-num sub{font-size:18px; color:var(--canvas-dim); font-weight:500;}
.hero-sub{font-size:13px; color:var(--canvas-dim); text-transform:uppercase; letter-spacing:0.05em;}
.ridge-box{width:100%; overflow:hidden; border-radius:4px; background:linear-gradient(to bottom, #16351f 0%, #0f2016 100%);}
.ridge-box svg{display:block; width:100%; height:auto;}
.rank-note{margin-top:10px; font-size:13px; color:var(--canvas-dim);}
.rank-note b{color:var(--gold);}

.onboard{max-width:440px; margin:60px auto; background:var(--canvas); color:var(--ink); border-radius:6px; padding:32px 30px; border:1px dashed var(--thread);}
.onboard h2{font-size:22px; margin-bottom:6px;}
.onboard p{font-size:14px; color:var(--ink-soft); line-height:1.6; margin:0 0 18px;}
.onboard input{
  width:100%; padding:10px 12px; font-size:15px; font-family:'Inter',sans-serif;
  border:1px solid var(--thread); border-radius:3px; background:#fffdf4; color:var(--ink); margin-bottom:14px;
}
.onboard button, .btn{
  font-family:'Oswald',sans-serif; text-transform:uppercase; letter-spacing:0.03em; font-size:13px;
  background:var(--rust); color:#fff2e6; border:none; padding:10px 18px; border-radius:3px; cursor:pointer; font-weight:600;
}
.onboard button:hover, .btn:hover{background:#9c4426;}
.onboard .fine{font-size:11.5px; color:var(--ink-soft); margin-top:10px; line-height:1.5;}

.namebar{display:flex; align-items:center; gap:10px; font-size:13px; color:var(--canvas-dim); margin-bottom:22px;}
.namebar a{color:var(--gold); cursor:pointer; text-decoration:underline;}

.group{margin-bottom:26px;}
.group-head{display:flex; align-items:center; gap:10px; margin-bottom:12px; cursor:pointer; user-select:none;}
.group-head:hover{opacity:0.85;}
.group-chevron{margin-left:auto; font-size:10px; color:var(--canvas-dim);}
.expand-all-row{margin:2px 0 16px;}
.expand-all-row a{font-size:12px; color:var(--gold); cursor:pointer; text-decoration:underline;}
.load-more-btn{display:block; width:100%; margin:14px 0 4px; padding:10px 0; font-size:12px;}
.group-head h3{font-size:15px; color:var(--canvas);}
.group-head .swatch{width:11px; height:11px; border-radius:50%;}
.group-head .count{font-size:12px; color:var(--canvas-dim);}
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(215px,1fr)); gap:14px;}

.controls-row{display:flex; gap:10px; margin-bottom:20px; flex-wrap:wrap;}
.controls-row input[type=text]{flex:1; min-width:180px; padding:9px 12px; font-size:14px; border:1px solid rgba(242,233,208,0.3); border-radius:3px; background:var(--bg-raised); color:var(--canvas); font-family:'Inter',sans-serif;}
.controls-row input[type=text]::placeholder{color:var(--canvas-dim);}
.controls-row select{padding:9px 10px; font-size:13px; border:1px solid rgba(242,233,208,0.3); border-radius:3px; background:var(--bg-raised); color:var(--canvas); font-family:'Inter',sans-serif;}
.no-results{padding:30px 16px; text-align:center; color:var(--canvas-dim); font-size:13px;}

.wall-head{margin-bottom:18px;}
.wall-head p{font-size:13px; color:var(--canvas-dim); margin:4px 0 0;}
.wall-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(126px,1fr)); gap:18px; background:var(--bg-raised); border-radius:8px; padding:24px; border:1px solid rgba(242,233,208,0.1);}
.wall-badge{display:flex; flex-direction:column; align-items:center; text-align:center; gap:6px;}
.wall-name{font-family:'Oswald',sans-serif; font-size:12.5px; font-weight:600; color:var(--canvas); line-height:1.2;}
.wall-place{font-size:10.5px; color:var(--canvas-dim);}
.wall-actions{display:flex; gap:10px; margin-top:12px; flex-wrap:wrap;}
.wall-actions .toggle-btn{width:auto; padding:9px 18px; margin-top:0;}
.toast{position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--canvas); color:var(--ink); padding:10px 20px; border-radius:4px; font-size:13px; font-weight:600; box-shadow:0 6px 18px rgba(0,0,0,0.35); z-index:50; max-width:80vw; text-align:center;}
.celebration{position:fixed; inset:0; display:flex; align-items:center; justify-content:center; pointer-events:none; z-index:80; padding:20px;}
.celebration-card{background:var(--canvas); color:var(--ink); padding:26px 36px; border-radius:10px; text-align:center; box-shadow:0 12px 44px rgba(0,0,0,0.45); border:2px solid var(--gold); animation:celeb-pop 0.4s ease-out;}
.celebration-emoji{font-size:24px; margin-bottom:8px; letter-spacing:4px;}
.celebration-title{font-family:'Oswald',sans-serif; font-size:21px; font-weight:700; letter-spacing:0.02em;}
.celebration-sub{font-size:13px; color:var(--ink-soft); margin-top:6px;}
@keyframes celeb-pop{ from{ transform:scale(0.7); opacity:0; } to{ transform:scale(1); opacity:1; } }
.modal-backdrop{position:fixed; inset:0; background:rgba(15,20,15,0.6); display:flex; align-items:center; justify-content:center; z-index:100; padding:20px;}
.modal-box{background:var(--canvas); color:var(--ink); border-radius:6px; padding:24px; max-width:360px; width:100%; border:1px dashed var(--thread);}
.modal-box p{font-size:14px; line-height:1.5; margin:0 0 16px;}
.modal-box input{width:100%; padding:9px 12px; font-size:14px; border:1px solid var(--thread); border-radius:3px; background:#fffdf4; color:var(--ink); margin-bottom:16px; font-family:'Inter',sans-serif;}
.modal-actions{display:flex; gap:10px; justify-content:flex-end;}
.modal-actions .btn{padding:8px 16px;}
.modal-actions .toggle-btn{width:auto; padding:8px 16px; margin-top:0;}

.wall-panel{background:var(--bg-raised); border-radius:8px; padding:26px 20px; background-image:repeating-linear-gradient(135deg, rgba(242,233,208,0.03) 0px, rgba(242,233,208,0.03) 1px, transparent 1px, transparent 14px);}
.wall-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); gap:22px 14px; justify-items:center;}
.patch{display:flex; flex-direction:column; align-items:center; text-align:center; cursor:default; transition:transform 0.15s ease;}
.patch:hover{transform:rotate(0deg) scale(1.06);}
.patch-name{font-family:'Oswald',sans-serif; font-size:12px; font-weight:600; color:var(--canvas); margin-top:6px; line-height:1.25;}
.patch-sub{font-size:10.5px; color:var(--canvas-dim); margin-top:2px;}

.card{
  position:relative; background:var(--canvas); color:var(--ink); border-radius:6px;
  border:1.5px dashed var(--thread); padding:14px 14px 12px; overflow:hidden;
  transition: transform 0.15s ease;
}
.card.done{background:var(--canvas-dim);}
.card:hover{transform:translateY(-2px);}
.card-top{display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
.peak-icon{flex-shrink:0; opacity:0.85;}
.card-name{font-family:'Oswald',sans-serif; font-size:15.5px; font-weight:600; line-height:1.2; margin:0;}
.card-place{font-size:11.5px; color:var(--ink-soft); font-style:italic; margin:3px 0 10px;}
.card-bottom{display:flex; justify-content:space-between; align-items:center;}
.masl{font-family:'JetBrains Mono',monospace; font-size:16px; font-weight:600;}
.masl small{font-size:10px; font-weight:400; color:var(--ink-soft);}
.diff-pill{font-size:10px; text-transform:uppercase; letter-spacing:0.02em; padding:3px 8px; border-radius:20px; font-weight:600;}
.toggle-btn{
  width:100%; margin-top:10px; padding:7px 0; font-family:'Oswald',sans-serif; font-size:12px; text-transform:uppercase;
  letter-spacing:0.03em; border-radius:3px; cursor:pointer; border:1px solid var(--thread); background:transparent; color:var(--ink); font-weight:600;
}
.card.done .toggle-btn{ background:var(--moss-d); color:var(--canvas); border-color:var(--moss-d); }
.climb-date{font-size:11px; color:var(--ink-soft); margin-top:7px; text-align:center;}
.climb-date a{color:var(--rust); text-decoration:underline; cursor:pointer;}
.stamp{
  position:absolute; top:8px; right:-26px; transform:rotate(28deg); background:rgba(181,80,46,0.9); color:#fff3e9;
  font-family:'Oswald',sans-serif; font-size:10px; font-weight:700; letter-spacing:0.06em; padding:3px 30px;
  pointer-events:none;
}
.timeline{background:var(--bg-raised); border-radius:8px; padding:4px 20px; border:1px solid rgba(242,233,208,0.1); margin-top:30px;}
.timeline-row{display:grid; grid-template-columns:10px 100px 1fr auto; align-items:center; gap:12px; padding:11px 0; border-bottom:1px solid rgba(242,233,208,0.08); font-size:13px;}
.timeline-row:last-child{border-bottom:none;}
.timeline-dot{width:9px; height:9px; border-radius:50%;}
.timeline-date{color:var(--canvas-dim); font-size:11.5px;}
.timeline-name{font-weight:600; color:var(--canvas);}
.timeline-place{color:var(--canvas-dim); font-size:11.5px; text-align:right;}

.stats-grid{display:grid; grid-template-columns:1fr 1fr; gap:28px; background:var(--bg-raised); border-radius:8px; padding:22px; margin-top:10px; border:1px solid rgba(242,233,208,0.1);}
.stats-col h4{font-family:'Oswald',sans-serif; font-size:12.5px; color:var(--canvas-dim); text-transform:uppercase; letter-spacing:0.05em; margin:0 0 12px;}
.stat-row{display:grid; grid-template-columns:96px 1fr 96px; align-items:center; gap:10px; margin-bottom:10px;}
.stat-label{color:var(--canvas); font-weight:600; font-size:12px;}
.stat-bar-track{background:rgba(242,233,208,0.1); border-radius:20px; height:9px; overflow:hidden;}
.stat-bar-fill{height:100%; border-radius:20px; transition:width 0.3s ease;}
.stat-value{color:var(--canvas-dim); text-align:right; font-size:10.5px;}
@media (max-width:600px){ .stats-grid{grid-template-columns:1fr;} }

.rank-wrap{background:var(--bg-raised); border-radius:6px; padding:6px 0; margin-top:10px;}
.rank-row{display:grid; grid-template-columns:40px 1fr 90px 110px; align-items:center; gap:6px; padding:10px 16px; font-size:14px; border-bottom:1px solid rgba(242,233,208,0.08);}
.rank-row.head{color:var(--canvas-dim); font-size:11px; text-transform:uppercase; letter-spacing:0.04em; border-bottom:1px solid rgba(242,233,208,0.18);}
.rank-row.me{background:rgba(197,151,45,0.14);}
.rank-num{font-family:'Oswald',sans-serif; font-weight:700; color:var(--gold);}
.rank-name{font-weight:600; cursor:pointer; text-decoration:underline; text-decoration-color:rgba(242,233,208,0.25);}
.rank-count, .rank-elev{font-family:'JetBrains Mono',monospace; font-size:13px; color:var(--canvas-dim); text-align:right;}
.empty{padding:30px 16px; text-align:center; color:var(--canvas-dim); font-size:13px;}

.settings-row{margin-top:30px; display:flex; gap:14px; align-items:center; font-size:12px; color:var(--canvas-dim);}
.settings-row a{color:var(--rust); cursor:pointer; text-decoration:underline;}

.edit-link{font-size:11px; color:var(--thread); text-decoration:underline; cursor:pointer; align-self:center;}
.card.editing{border-color:var(--rust); border-style:solid;}
.edit-field{margin-bottom:8px;}
.edit-field-row{display:flex; gap:8px;}
.edit-field-row .edit-field{flex:1;}
.edit-field label{display:block; font-size:10px; text-transform:uppercase; letter-spacing:0.04em; color:var(--ink-soft); margin-bottom:3px;}
.edit-field input, .edit-field select{width:100%; padding:6px 8px; font-size:13px; border:1px solid var(--thread); border-radius:3px; background:#fffdf4; color:var(--ink); font-family:'Inter',sans-serif;}
.edit-actions{display:flex; gap:8px; margin-top:6px;}
.edit-actions .btn{flex:1; padding:7px 0; font-size:11px;}
.edit-actions .toggle-btn{flex:1; margin-top:0;}
.edit-note{font-size:12px; color:var(--canvas-dim); margin:-4px 0 18px;}

.modal-box textarea{width:100%; padding:9px 12px; font-size:13px; border:1px solid var(--thread); border-radius:3px; background:#fffdf4; color:var(--ink); font-family:'Inter',sans-serif; margin-bottom:12px; resize:vertical;}
.modal-field-label{display:block; font-size:10px; text-transform:uppercase; letter-spacing:0.04em; color:var(--ink-soft); margin-bottom:4px;}
.modal-box input[type=file]{margin-bottom:10px; font-size:12px; width:100%;}
.modal-photo-preview{max-width:100%; border-radius:4px; display:block; margin-bottom:6px;}
.climb-meta{margin-top:8px; display:flex; align-items:flex-start; gap:8px;}
.climb-photo-thumb{width:36px; height:36px; border-radius:4px; object-fit:cover; flex-shrink:0; border:1px solid var(--thread); cursor:pointer;}
.climb-notes{font-size:11px; color:var(--ink-soft); font-style:italic; line-height:1.4; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;}
.photo-lightbox{position:fixed; inset:0; background:rgba(10,14,10,0.85); display:flex; align-items:center; justify-content:center; z-index:110; padding:24px; cursor:zoom-out;}
.photo-lightbox img{max-width:90vw; max-height:85vh; border-radius:6px;}

.post-composer{background:var(--canvas); color:var(--ink); border-radius:6px; padding:16px; border:1px dashed var(--thread); margin-bottom:22px;}
.post-composer textarea{width:100%; padding:9px 12px; font-size:14px; border:1px solid var(--thread); border-radius:3px; background:#fffdf4; color:var(--ink); font-family:'Inter',sans-serif; resize:vertical; margin-bottom:10px;}
.composer-row{display:flex; gap:10px; flex-wrap:wrap; align-items:center;}
.composer-row select{padding:8px 10px; font-size:12.5px; border:1px solid var(--thread); border-radius:3px; background:#fffdf4; color:var(--ink); font-family:'Inter',sans-serif; flex:1; min-width:160px;}
.composer-row input[type=file]{font-size:12px; flex:1; min-width:160px;}
.feed-list{display:flex; flex-direction:column; gap:16px;}
.post-card{background:var(--canvas); color:var(--ink); border-radius:6px; padding:16px 18px; border:1px solid rgba(0,0,0,0.06);}
.post-head{display:flex; align-items:baseline; gap:8px; margin-bottom:6px;}
.post-author{font-family:'Oswald',sans-serif; font-weight:600; font-size:14px; cursor:pointer; text-decoration:underline; text-decoration-color:rgba(0,0,0,0.15);}
.post-time{font-size:11.5px; color:var(--ink-soft);}
.post-tag{display:inline-block; font-size:11.5px; color:var(--rust); font-weight:600; margin-bottom:6px;}
.post-content{font-size:14px; line-height:1.5; margin:0 0 10px; white-space:pre-wrap;}
.post-photo{max-width:100%; max-height:380px; width:auto; height:auto; border-radius:5px; display:block; margin:0 0 10px; cursor:zoom-in; object-fit:cover;}
.post-photos{display:grid; gap:4px; margin:0 0 10px; border-radius:5px; overflow:hidden; max-height:380px;}
.post-photos.count-1{grid-template-columns:1fr;}
.post-photos.count-2{grid-template-columns:1fr 1fr;}
.post-photos.count-3{grid-template-columns:1fr 1fr;}
.post-photos.count-3 .post-photo-item-wrap:first-child{grid-row:span 2;}
.post-photos.count-4{grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr;}
.post-photo-item-wrap{position:relative; overflow:hidden;}
.post-photo-item{width:100%; height:100%; object-fit:cover; display:block; cursor:zoom-in; min-height:120px;}
.post-photo-more{position:absolute; inset:0; background:rgba(0,0,0,0.55); color:#fff; display:flex; align-items:center; justify-content:center; font-size:20px; font-weight:700; font-family:'Oswald',sans-serif; cursor:zoom-in;}
.post-actions{display:flex; gap:14px; padding-top:8px; border-top:1px solid rgba(0,0,0,0.08);}
.post-like-btn, .post-comment-btn{background:none; border:none; cursor:pointer; font-size:13px; color:var(--ink-soft); font-family:'Inter',sans-serif; padding:4px 2px;}
.post-like-btn.liked{color:var(--rust); font-weight:600;}
.comments-list{margin-top:10px; padding-top:10px; border-top:1px solid rgba(0,0,0,0.08); display:flex; flex-direction:column; gap:6px;}
.comment-row{font-size:12.5px; line-height:1.5;}
.comment-row b{font-family:'Oswald',sans-serif; font-weight:600; margin-right:4px;}
.comment-input-row{display:flex; gap:8px; margin-top:6px;}
.comment-input-row input{flex:1; padding:7px 10px; font-size:12.5px; border:1px solid var(--thread); border-radius:3px; background:#fffdf4; color:var(--ink); font-family:'Inter',sans-serif;}
.comment-input-row .btn{padding:7px 14px; font-size:11px;}
.feed-filter-row{display:flex; gap:8px; margin-bottom:16px;}
.feed-filter-btn{background:none; border:1px solid rgba(242,233,208,0.25); color:var(--canvas-dim); font-family:'Oswald',sans-serif; text-transform:uppercase; letter-spacing:0.03em; font-size:12px; padding:7px 14px; border-radius:20px; cursor:pointer;}
.feed-filter-btn.active{background:var(--canvas); color:var(--ink); border-color:var(--canvas); font-weight:600;}
.follow-btn{margin-top:10px;}
.streak-line{font-size:13px; color:var(--gold); margin:4px 0 0;}

.conv-list{display:flex; flex-direction:column; gap:2px;}
.conv-row{background:var(--canvas); color:var(--ink); border-radius:6px; padding:12px 16px; cursor:pointer; margin-bottom:8px; border:1px solid rgba(0,0,0,0.06);}
.conv-row:hover{border-color:var(--rust);}
.conv-row.unread{border-left:3px solid var(--rust);}
.conv-top{display:flex; align-items:center; gap:8px;}
.conv-name{font-family:'Oswald',sans-serif; font-weight:600; font-size:14px;}
.conv-time{margin-left:auto; font-size:11px; color:var(--ink-soft);}
.conv-preview{font-size:12.5px; color:var(--ink-soft); margin-top:3px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.dm-thread{display:flex; flex-direction:column; gap:8px; max-height:56vh; overflow-y:auto; padding:6px 2px 14px;}
.dm-bubble{max-width:70%; padding:9px 13px; border-radius:14px; font-size:13.5px; line-height:1.4;}
.dm-bubble.theirs{align-self:flex-start; background:var(--canvas); color:var(--ink); border-bottom-left-radius:3px;}
.dm-bubble.mine{align-self:flex-end; background:var(--rust); color:#fff3e9; border-bottom-right-radius:3px;}
.dm-bubble .dm-time{font-size:10px; opacity:0.65; margin-top:3px;}
.dm-input-row{display:flex; gap:8px; margin-top:10px;}
.dm-input-row input{flex:1; padding:10px 14px; font-size:13.5px; border:1px solid rgba(242,233,208,0.25); border-radius:20px; background:var(--bg-raised); color:var(--canvas); font-family:'Inter',sans-serif;}
.dm-input-row .btn{border-radius:20px; padding:10px 20px;}

#mountain-map{background:var(--bg);}
#mountain-map .map-tiles-green{filter:hue-rotate(100deg) saturate(1.3) brightness(1) contrast(1.05);}
#mountain-map .leaflet-control-zoom a{background:var(--canvas); color:var(--ink); border-color:rgba(0,0,0,0.15);}

function parseMaslNum(raw){
  const cleaned = String(raw).replace(/[~\s]/g,"").replace(/(\d),(\d)/g,"$1$2");
  const nums = (cleaned.match(/\d+/g)||[]).map(Number);
  if(nums.length===0) return 0;
  if(nums.length>=2) return Math.round((nums[0]+nums[1])/2);
  return nums[0];
}

const DIFFICULTY_OPTIONS = ["Beginner","Beginner to moderate","Moderate","Moderate to difficult","Difficult","Very difficult"];

function parseCSVLine(line){
  const result = [];
  let cur = "", inQuotes = false;
  for(let i=0;i<line.length;i++){
    const ch = line[i];
    if(inQuotes){
      if(ch === '"'){
        if(line[i+1] === '"'){ cur += '"'; i++; }
        else inQuotes = false;
      } else cur += ch;
    } else {
      if(ch === '"') inQuotes = true;
      else if(ch === ','){ result.push(cur.trim()); cur = ""; }
      else cur += ch;
    }
  }
  result.push(cur.trim());
  return result;
}

function normalizeDifficulty(d){
  const found = DIFFICULTY_OPTIONS.find(opt => opt.toLowerCase() === String(d).toLowerCase().trim());
  return found || "Moderate";
}

function parseBulkImportText(text){
  const lines = String(text).split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  const rows = [];
  for(const line of lines){
    const fields = parseCSVLine(line);
    if(fields.length < 4) continue;
    if(fields[0].toLowerCase() === "mountain") continue; // skip header row
    let name, place, difficulty, maslRaw;
    if(fields.length === 4){
      [name, place, difficulty, maslRaw] = fields;
    } else {
      name = fields[0];
      difficulty = fields[fields.length-2];
      maslRaw = fields[fields.length-1];
      place = fields.slice(1, fields.length-2).join(", ");
    }
    name = (name||"").trim();
    maslRaw = (maslRaw||"").replace(/^~/,"").trim();
    if(!name || !maslRaw) continue;
    rows.push({ name, place: (place||"").trim() || "Philippines", difficulty: normalizeDifficulty(difficulty), maslRaw });
  }
  return rows;
}

async function runBulkImport(){
  const textEl = document.getElementById("bulk-import-text");
  const rows = parseBulkImportText(textEl ? textEl.value : "");
  if(rows.length === 0){ showToast("Couldn't find any valid rows to import."); return; }

  const existingNames = new Set(MOUNTAINS.map(m=>m.name.trim().toLowerCase()));
  const seenInBatch = new Set();
  const toInsert = [];
  let skipped = 0;
  rows.forEach(r=>{
    const key = r.name.toLowerCase();
    if(existingNames.has(key) || seenInBatch.has(key)){ skipped++; return; }
    seenInBatch.add(key);
    toInsert.push({
      name: r.name, place: r.place, difficulty: r.difficulty,
      masl_num: parseMaslNum(r.maslRaw), masl_raw: r.maslRaw, created_by: state.user.id
    });
  });

  if(toInsert.length === 0){
    showToast(`No new mountains to add — all ${skipped} matched existing ones.`);
    return;
  }

  const { data, error } = await sb.from("mountains").insert(toInsert).select();
  if(error){ showToast("Import failed: "+error.message); return; }
  (data||[]).forEach(row=>{
    MOUNTAINS.push({ id:row.id, legacyId:row.legacy_id, name:row.name, place:row.place, difficulty:row.difficulty, maslNum:row.masl_num, maslRaw:row.masl_raw, createdBy:row.created_by, lat:row.lat, lng:row.lng });
  });
  state.showBulkImport = false;
  render();
  showToast(`Added ${data.length} mountain${data.length!==1?'s':''}.${skipped>0 ? ` Skipped ${skipped} duplicate${skipped!==1?'s':''}.` : ''}`);
}

const CAT = (diff)=>{
  const d = diff.toLowerCase();
  if(d.includes("very difficult")) return {label:"Very difficult", fill:"var(--brick)", dk:"var(--brick-d)"};
  if(d==="difficult") return {label:"Difficult", fill:"var(--rust)", dk:"var(--rust-d)"};
  if(d.includes("moderate to difficult")) return {label:"Moderate to difficult", fill:"var(--amber)", dk:"var(--amber-d)"};
  if(d==="moderate") return {label:"Moderate", fill:"var(--gold)", dk:"var(--gold-d)"};
  if(d.includes("beginner to moderate")) return {label:"Beginner to moderate", fill:"var(--teal)", dk:"var(--teal-d)"};
  return {label:"Beginner", fill:"var(--moss)", dk:"var(--moss-d)"};
};

const GROUP_ORDER = ["Very difficult","Difficult","Moderate to difficult","Moderate","Beginner to moderate","Beginner"];

const PEAK_ICON = (color)=>`<svg class="peak-icon" width="26" height="20" viewBox="0 0 26 20"><path d="M1 18L9 4L13 10L17 2L25 18Z" fill="none" stroke="${color}" stroke-width="1.6" stroke-linejoin="round"/><path d="M9 4L11 8.5L7 8.5Z" fill="${color}"/></svg>`;

function hashId(s){
  let h = 0;
  for(let i=0;i<s.length;i++){ h = (h*31 + s.charCodeAt(i)) | 0; }
  return Math.abs(h);
}

function badgeSVG(m, size){
  size = size || 52;
  const c = CAT(m.difficulty);
  const globalMax = Math.max(...MOUNTAINS.map(x=>x.maslNum), 1);
  const hFrac = 0.35 + 0.65 * Math.sqrt(m.maslNum / globalMax);
  const baseY = 46;
  const iconic = ICONIC_SHAPES[m.legacyId];
  let shapeMarkup;
  if(iconic){
    const extra = iconic.extra ? iconic.extra.replace(/CURRENT_DK/g, c.dk).replace(/CURRENT_FILL/g, c.fill) : "";
    shapeMarkup = `<g transform="translate(32,${baseY}) scale(1,${hFrac.toFixed(3)}) translate(-32,-${baseY})">
      <path d="${iconic.path}" style="fill:${c.fill}; stroke:${c.dk}; stroke-width:1"/>
      ${extra}
    </g>`;
  } else {
    const topY = baseY - hFrac*30, midY = baseY - hFrac*20;
    const jitter = (hashId(m.id+m.name) % 9) - 4;
    const midX = 32 + jitter, leftX = 8, rightX = 56;
    const snow = m.maslNum >= 2500;
    shapeMarkup = `<path d="M${leftX} ${baseY} L${(midX-10).toFixed(1)} ${midY.toFixed(1)} L${midX} ${topY.toFixed(1)} L${(midX+10).toFixed(1)} ${midY.toFixed(1)} L${rightX} ${baseY} Z" style="fill:${c.fill}; stroke:${c.dk}; stroke-width:1"/>
    ${snow ? `<path d="M${midX-4} ${(topY+5).toFixed(1)} L${midX} ${topY.toFixed(1)} L${midX+4} ${(topY+5).toFixed(1)} Z" style="fill:#f2e9d0"/>` : ``}`;
  }
  return `<svg width="${size}" height="${size}" viewBox="0 0 64 64" aria-hidden="true">
    <circle cx="32" cy="32" r="29" style="fill:var(--canvas); stroke:${c.fill}; stroke-width:4"/>
    ${shapeMarkup}
    <text x="32" y="58" text-anchor="middle" style="font-family:'JetBrains Mono',monospace; font-size:8px; font-weight:600; fill:${c.dk};">${m.maslNum}</text>
  </svg>`;
}

const HEX = {
  bg:"#202b21", canvas:"#f2e9d0", canvasDim:"#c9bd97",
  moss:"#6b8f5c", mossD:"#35401e", teal:"#4f8f81", tealD:"#1e3730",
  gold:"#c9a227", goldD:"#4a3a0c", amber:"#c2791f", amberD:"#4a2c07",
  rust:"#b5502e", rustD:"#481f10", brick:"#8b3a3a", brickD:"#3a1414"
};
function CAT_HEX(diff){
  const d = diff.toLowerCase();
  if(d.includes("very difficult")) return {fill:HEX.brick, dk:HEX.brickD};
  if(d==="difficult") return {fill:HEX.rust, dk:HEX.rustD};
  if(d.includes("moderate to difficult")) return {fill:HEX.amber, dk:HEX.amberD};
  if(d==="moderate") return {fill:HEX.gold, dk:HEX.goldD};
  if(d.includes("beginner to moderate")) return {fill:HEX.teal, dk:HEX.tealD};
  return {fill:HEX.moss, dk:HEX.mossD};
}
function truncateName(s, n){ return s.length > n ? s.slice(0, n-1)+"…" : s; }

function exportBadgeGroup(m, cx, cy){
  const c = CAT_HEX(m.difficulty);
  const globalMax = Math.max(...MOUNTAINS.map(x=>x.maslNum), 1);
  const hFrac = 0.35 + 0.65 * Math.sqrt(m.maslNum / globalMax);
  const r = 46;
  const iconic = ICONIC_SHAPES[m.legacyId];
  let shapeMarkup;
  if(iconic){
    const k = r/29;
    const extra = iconic.extra ? iconic.extra.replace(/CURRENT_DK/g, c.dk).replace(/CURRENT_FILL/g, c.fill) : "";
    shapeMarkup = `<g transform="translate(${cx},${cy}) scale(${k.toFixed(3)}) translate(-32,-32)">
      <g transform="translate(32,46) scale(1,${hFrac.toFixed(3)}) translate(-32,-46)">
        <path d="${iconic.path}" fill="${c.fill}" stroke="${c.dk}" stroke-width="1"/>
        ${extra}
      </g>
    </g>`;
  } else {
    const baseY = cy+30, topY = cy+30-hFrac*46, midY = cy+30-hFrac*30;
    const jitter = (hashId(m.id+m.name) % 13) - 6;
    const midX = cx+jitter, leftX = cx-40, rightX = cx+40;
    const snow = m.maslNum >= 2500;
    shapeMarkup = `<path d="M${leftX} ${baseY} L${(midX-16).toFixed(1)} ${midY.toFixed(1)} L${midX.toFixed(1)} ${topY.toFixed(1)} L${(midX+16).toFixed(1)} ${midY.toFixed(1)} L${rightX} ${baseY} Z" fill="${c.fill}" stroke="${c.dk}" stroke-width="1.5"/>
    ${snow ? `<path d="M${(midX-6).toFixed(1)} ${(topY+8).toFixed(1)} L${midX.toFixed(1)} ${topY.toFixed(1)} L${(midX+6).toFixed(1)} ${(topY+8).toFixed(1)} Z" fill="#f2e9d0"/>` : ``}`;
  }
  return `
  <circle cx="${cx}" cy="${cy}" r="${r}" fill="${HEX.canvas}" stroke="${c.fill}" stroke-width="6"/>
  ${shapeMarkup}
  <text x="${cx}" y="${cy+42}" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" font-weight="600" fill="${c.dk}">${m.maslNum}</text>
  <text x="${cx}" y="${cy+70}" text-anchor="middle" font-family="Oswald, sans-serif" font-size="13" font-weight="600" fill="${HEX.canvas}">${esc(truncateName(m.name,18))}</text>`;
}

function buildWallExportSVG(){
  const done = MOUNTAINS.filter(m=>state.hiked.has(m.id)).sort((a,b)=>b.maslNum-a.maslNum);
  const cols = Math.max(1, Math.min(5, done.length));
  const cellW = 160, cellH = 176, padX = 40, padTop = 130, padBottom = 40;
  const rows = Math.ceil(done.length / cols) || 1;
  const width = cols*cellW + padX*2;
  const height = padTop + rows*cellH + padBottom;
  const totalElev = done.reduce((s,m)=>s+m.maslNum,0);
  let badges = "";
  done.forEach((m,i)=>{
    const col = i % cols, row = Math.floor(i/cols);
    const cx = padX + col*cellW + cellW/2;
    const cy = padTop + row*cellH + 50;
    badges += exportBadgeGroup(m, cx, cy);
  });
  return `<svg xmlns="http://www.w3.org/2000/svg" width="${width}" height="${height}" viewBox="0 0 ${width} ${height}">
    <rect width="${width}" height="${height}" fill="${HEX.bg}"/>
    <text x="${padX}" y="52" font-family="Oswald, sans-serif" font-size="26" font-weight="700" fill="${HEX.canvas}" letter-spacing="1">SUMMIT LOG · ${esc(state.profile ? state.profile.display_name : "")}</text>
    <text x="${padX}" y="80" font-family="JetBrains Mono, monospace" font-size="14" fill="${HEX.canvasDim}">${done.length} peaks badged · ${totalElev.toLocaleString()} masl climbed</text>
    ${badges}
  </svg>`;
}

function checkMilestones(){
  const milestones = [5,10,25,50,75,100];
  const count = state.hiked.size;
  if(milestones.includes(count) && !celebrated.has("count-"+count)){
    celebrated.add("count-"+count);
    saveCelebrated();
    showCelebration(`${count} peaks badged!`, "Keep the streak going.");
    return;
  }
  if(count === MOUNTAINS.length && MOUNTAINS.length > 0 && !celebrated.has("all")){
    celebrated.add("all");
    saveCelebrated();
    showCelebration("Every mountain on the list!", "You've badged all of them.");
    return;
  }
  for(const cat of GROUP_ORDER){
    const list = MOUNTAINS.filter(m => CAT(m.difficulty).label === cat);
    if(list.length === 0) continue;
    const key = "cat-"+cat;
    if(!celebrated.has(key) && list.every(m => state.hiked.has(m.id))){
      celebrated.add(key);
      saveCelebrated();
      showCelebration(`All ${cat} peaks done!`, `Every ${cat.toLowerCase()} mountain, badged.`);
      return;
    }
  }
}

async function handleModalConfirm(){
  const modal = state.modal;
  if(!modal) return;

  if(modal.kind === "prompt" && modal.action === "rename"){
    const inputEl = document.getElementById("modal-input");
    const value = inputEl ? inputEl.value.trim() : "";
    if(value && value !== state.profile.display_name){
      const { error } = await sb.from("profiles").update({ display_name: value }).eq("id", state.user.id);
      if(error){ showToast("Could not rename: "+error.message); }
      else{
        state.profile.display_name = value;
        await loadLeaderboard();
      }
    }

  } else if(modal.kind === "password" && modal.action === "change-password"){
    const inputEl = document.getElementById("modal-input");
    const value = inputEl ? inputEl.value : "";
    if(!value || value.length < 6){ state.authError = "Password must be at least 6 characters."; render(); return; }
    const { error } = await sb.auth.updateUser({ password: value });
    state.authError = null;
    if(error){ showToast("Could not change password: "+error.message); }
    else{ showToast("Password updated."); }

  } else if(modal.kind === "report" && (modal.action === "report-post" || modal.action === "report-comment")){
    const inputEl = document.getElementById("modal-input");
    const reason = inputEl ? inputEl.value.trim() : "";
    const targetType = modal.action === "report-post" ? "post" : "comment";
    await submitReport(targetType, modal.payload, reason);

  } else if(modal.kind === "date" && (modal.action === "mark-hiked" || modal.action === "edit-date")){
    const inputEl = document.getElementById("modal-input");
    const dateVal = inputEl ? inputEl.value : "";
    const notesEl = document.getElementById("modal-notes");
    const notesVal = notesEl ? notesEl.value.trim() : "";
    const photoInput = document.getElementById("modal-photo");
    const file = photoInput && photoInput.files && photoInput.files[0];

    let photoUrl = modal.removePhoto ? null : (modal.photoUrlDefault || null);
    if(file){
      const upload = await uploadClimbPhoto(modal.payload, file);
      if(upload.error){ showToast("Could not upload photo: "+upload.error.message); return; }
      photoUrl = upload.url;
    }

    const fields = { climbed_on: dateVal || null, notes: notesVal || null, photo_url: photoUrl };
    let error;
    if(modal.action === "mark-hiked"){
      ({ error } = await sb.from("climbs").upsert({ user_id: state.user.id, mountain_id: modal.payload, ...fields }, { onConflict: "user_id,mountain_id" }));
    } else {
      ({ error } = await sb.from("climbs").update(fields).eq("user_id", state.user.id).eq("mountain_id", modal.payload));
    }
    if(error){ showToast("Could not save that climb: "+error.message); return; }

    state.hiked.add(modal.payload);
    state.hikedDates[modal.payload] = fields.climbed_on;
    state.hikedNotes[modal.payload] = fields.notes;
    state.hikedPhotos[modal.payload] = fields.photo_url;
    await loadLeaderboard();
    state.modal = null;
    render();
    if(modal.action === "mark-hiked") checkMilestones();
    return;

  } else if(modal.action === "unmark"){
    const { error } = await sb.from("climbs").delete().eq("user_id", state.user.id).eq("mountain_id", modal.payload);
    if(!error){
      state.hiked.delete(modal.payload);
      delete state.hikedDates[modal.payload];
      delete state.hikedNotes[modal.payload];
      delete state.hikedPhotos[modal.payload];
      await loadLeaderboard();
    } else showToast("Could not remove badge: "+error.message);

  } else if(modal.action === "delete-mountain"){
    const id = modal.payload;
    const { error } = await sb.from("mountains").delete().eq("id", id);
    if(!error){
      MOUNTAINS = MOUNTAINS.filter(x=>x.id!==id);
      state.hiked.delete(id);
      delete state.hikedDates[id];
      delete state.hikedNotes[id];
      delete state.hikedPhotos[id];
      await loadLeaderboard();
    } else showToast("Could not delete: "+error.message);
    state.editingId = null;

  } else if(modal.action === "reset-log"){
    const { error } = await sb.from("climbs").delete().eq("user_id", state.user.id);
    if(!error){
      state.hiked = new Set();
      state.hikedDates = {};
      state.hikedNotes = {};
      state.hikedPhotos = {};
      await loadLeaderboard();
    } else showToast("Could not reset: "+error.message);

  } else if(modal.action === "delete-post"){
    await deletePostById(modal.payload);
  }
  state.modal = null;
  render();
}

async function copySummary(){
  const done = MOUNTAINS.filter(m=>state.hiked.has(m.id));

  const text = `${state.profile.display_name} · ${done.length}/${MOUNTAINS.length} peaks badged · ${totalElev.toLocaleString()} masl climbed — Summit Log`;
  try{
    await navigator.clipboard.writeText(text);
    showToast("Copied to clipboard!");
  }catch(e){
    try{
      const ta = document.createElement("textarea");
      ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      document.execCommand("copy");
      document.body.removeChild(ta);
      showToast("Copied to clipboard!");
    }catch(e2){
      showToast(text);
    }
  }
}

function downloadWallImage(){
  const done = MOUNTAINS.filter(m=>state.hiked.has(m.id));
  if(done.length === 0){ showToast("Badge a mountain first to make an image."); return; }
  const svgStr = buildWallExportSVG();
  const svgBlob = new Blob([svgStr], {type:"image/svg+xml;charset=utf-8"});
  const url = URL.createObjectURL(svgBlob);
  const img = new Image();
  img.onload = ()=>{
    const scale = 2;
    const canvas = document.createElement("canvas");
    canvas.width = img.width * scale;
    canvas.height = img.height * scale;
    const ctx = canvas.getContext("2d");
    ctx.scale(scale, scale);
    ctx.drawImage(img, 0, 0);
    URL.revokeObjectURL(url);
    canvas.toBlob((blob)=>{
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "summit-log-badge-wall.png";
      a.click();
    }, "image/png");
  };
  img.onerror = ()=>{ URL.revokeObjectURL(url); showToast("Couldn't generate the image — try copy summary instead."); };
  img.src = url;
}

// ---- Leaderboard: aggregate every user's climbs client-side ----
async function loadLeaderboard(){
  const { data, error } = await sb
    .from("climbs")
    .select("user_id, created_at, mountains(masl_num, place), profiles(display_name)");
  if(error){ state.leaderboard = []; return; }
  const byUser = {};
  (data||[]).forEach(row=>{
    const uid = row.user_id;
    if(!byUser[uid]){
      byUser[uid] = { userId:uid, name: row.profiles ? row.profiles.display_name : "Hiker", count:0, elev:0, regionCounts:{}, regionElev:{}, updated:0 };
    }
    const entry = byUser[uid];
    entry.count++;
    const masl = row.mountains ? row.mountains.masl_num : 0;
    entry.elev += masl;
    const region = row.mountains ? inferRegion(row.mountains.place) : "Other";
    entry.regionCounts[region] = (entry.regionCounts[region]||0)+1;
    entry.regionElev[region] = (entry.regionElev[region]||0)+masl;
    const t = new Date(row.created_at).getTime();
    if(t > entry.updated) entry.updated = t;
  });
  const list = Object.values(byUser);
  list.sort((a,b)=> (b.count-a.count) || (b.elev-a.elev));
  state.leaderboard = list;
}

// ---- Climb photo upload ----
async function uploadClimbPhoto(mountainId, file){
  const ext = (file.name.split(".").pop() || "jpg").toLowerCase().replace(/[^a-z0-9]/g,"") || "jpg";
  const path = `${state.user.id}/${mountainId}.${ext}`;
  const { error: upErr } = await sb.storage.from("climb-photos").upload(path, file, { upsert: true });
  if(upErr) return { error: upErr };
  const { data } = sb.storage.from("climb-photos").getPublicUrl(path);
  return { url: data.publicUrl + "?t=" + Date.now() };
}

function timeAgo(dateStr){
  const diff = Date.now() - new Date(dateStr).getTime();
  const mins = Math.floor(diff/60000);
  if(mins < 1) return "just now";
  if(mins < 60) return mins+"m ago";
  const hrs = Math.floor(mins/60);
  if(hrs < 24) return hrs+"h ago";
  const days = Math.floor(hrs/24);
  if(days < 30) return days+"d ago";
  return formatDate(dateStr.slice(0,10));
}

async function uploadPostPhotos(clientId, files){
  const urls = [];
  for(let i=0;i<files.length;i++){
    const file = files[i];
    const ext = (file.name.split(".").pop() || "jpg").toLowerCase().replace(/[^a-z0-9]/g,"") || "jpg";
    const path = `${state.user.id}/post-${clientId}-${i}.${ext}`;
    const { error: upErr } = await sb.storage.from("climb-photos").upload(path, file, { upsert: true });
    if(upErr) return { error: upErr, urls };
    const { data } = sb.storage.from("climb-photos").getPublicUrl(path);
    urls.push(data.publicUrl + "?t=" + Date.now());
  }
  return { urls };
}

async function loadFeed(){
  const { data: postsData, error } = await sb.from("posts")
    .select("id, user_id, content, photo_url, photo_urls, mountain_id, created_at, profiles(display_name)")
    .order("created_at", { ascending:false })
    .limit(50);
  if(error){ state.feedPosts = []; return; }
  const postIds = (postsData||[]).map(p=>p.id);
  let likesData = [], commentsData = [];
  if(postIds.length){
    const likesRes = await sb.from("post_likes").select("post_id, user_id").in("post_id", postIds);
    likesData = likesRes.data || [];
    const commentsRes = await sb.from("post_comments").select("id, post_id, user_id, content, created_at, parent_comment_id, profiles(display_name)").in("post_id", postIds).order("created_at", {ascending:true});
    commentsData = commentsRes.data || [];
  }
  state.feedPosts = (postsData||[]).map(p=>{
    const likes = likesData.filter(l=>l.post_id===p.id);
    const comments = commentsData.filter(c=>c.post_id===p.id);
    const mountain = p.mountain_id ? MOUNTAINS.find(m=>m.id===p.mountain_id) : null;
    const photoUrls = (p.photo_urls && p.photo_urls.length) ? p.photo_urls : (p.photo_url ? [p.photo_url] : []);
    return {
      id: p.id,
      userId: p.user_id,
      authorName: p.profiles ? p.profiles.display_name : "Hiker",
      content: p.content,
      photoUrls: photoUrls,
      mountainName: mountain ? mountain.name : null,
      createdAt: p.created_at,
      likeCount: likes.length,
      likedByMe: likes.some(l=>l.user_id===state.user.id),
      comments: comments.map(c=>({ id:c.id, userId:c.user_id, authorName: c.profiles?c.profiles.display_name:"Hiker", content:c.content, createdAt:c.created_at, parentId:c.parent_comment_id||null }))
    };
  });
  state.feedLoaded = true;
}

async function createPost(){
  const textEl = document.getElementById("post-content");
  const content = textEl ? textEl.value.trim() : "";
  const fileInput = document.getElementById("post-photo");
  const files = fileInput && fileInput.files ? Array.from(fileInput.files) : [];
  const mountainSelect = document.getElementById("post-mountain");
  const mountainId = mountainSelect && mountainSelect.value ? mountainSelect.value : null;
  if(!content && files.length === 0){ showToast("Write something or attach a photo first."); return; }

  let photoUrls = [];
  if(files.length){
    const clientId = Date.now().toString(36) + Math.random().toString(36).slice(2,6);
    const upload = await uploadPostPhotos(clientId, files);
    if(upload.error){ showToast("Could not upload photo: "+upload.error.message); return; }
    photoUrls = upload.urls;
  }
  const { error } = await sb.from("posts").insert({ user_id: state.user.id, content: content || null, photo_urls: photoUrls.length ? photoUrls : null, mountain_id: mountainId });
  if(error){ showToast("Could not post: "+error.message); return; }
  await loadFeed();
  render();
}

async function toggleLike(postId){
  const post = state.feedPosts.find(p=>p.id===postId);
  if(!post) return;
  if(post.likedByMe){
    const { error } = await sb.from("post_likes").delete().eq("post_id", postId).eq("user_id", state.user.id);
    if(!error){ post.likedByMe = false; post.likeCount--; render(); }
  } else {
    const { error } = await sb.from("post_likes").insert({ post_id: postId, user_id: state.user.id });
    if(!error){ post.likedByMe = true; post.likeCount++; render(); }
  }
}

async function addComment(postId, parentId){
  const inputId = parentId ? "reply-input-"+parentId : "comment-input-"+postId;
  const input = document.getElementById(inputId);

  render();
}

// ---- Streaks: consecutive weeks with at least one dated climb ----
function computeStreakWeeks(hikedDatesMap){
  const dates = Object.values(hikedDatesMap||{}).filter(Boolean).map(d=>new Date(d+"T00:00:00"));
  if(dates.length === 0) return 0;
  function mondayOf(d){
    const day = d.getDay();
    const diff = (day+6)%7;
    const m = new Date(d);
    m.setDate(d.getDate()-diff);
    m.setHours(0,0,0,0);
    return m;
  }
  const weekKeys = new Set(dates.map(d=>mondayOf(d).toISOString().slice(0,10)));
  let cursor = mondayOf(new Date());
  if(!weekKeys.has(cursor.toISOString().slice(0,10))){
    cursor.setDate(cursor.getDate()-7);
  }
  let streak = 0;
  while(weekKeys.has(cursor.toISOString().slice(0,10))){
    streak++;
    cursor.setDate(cursor.getDate()-7);
  }
  return streak;
}

// ---- Direct messages ----
async function loadConversations(){
  const { data, error } = await sb.from("direct_messages")
    .select("id, sender_id, recipient_id, content, created_at, read_at")
    .or(`sender_id.eq.${state.user.id},recipient_id.eq.${state.user.id}`)
    .order("created_at", { ascending:false });
  if(error){ state.conversations = []; state.unreadMessageCount = 0; return; }
  const byPartner = {};
  (data||[]).forEach(m=>{
    const partnerId = m.sender_id === state.user.id ? m.recipient_id : m.sender_id;
    if(!byPartner[partnerId]) byPartner[partnerId] = { partnerId, messages:[], unread:0 };
    byPartner[partnerId].messages.push(m);
    if(m.recipient_id === state.user.id && !m.read_at) byPartner[partnerId].unread++;
  });
  const partnerIds = Object.keys(byPartner);
  let names = {};
  if(partnerIds.length){
    const { data: profs } = await sb.from("profiles").select("id, display_name").in("id", partnerIds);
    (profs||[]).forEach(p=>{ names[p.id] = p.display_name; });
  }
  const list = Object.values(byPartner).map(c=>({
    partnerId: c.partnerId,
    partnerName: names[c.partnerId] || "Hiker",
    lastMessage: c.messages[0],
    unread: c.unread
  }));
  list.sort((a,b)=> new Date(b.lastMessage.created_at) - new Date(a.lastMessage.created_at));
  state.conversations = list;
  state.unreadMessageCount = list.reduce((s,c)=>s+c.unread,0);
}

async function openConversation(partnerId, partnerName){
  state.activeConversation = { partnerId, partnerName, messages: [] };
  render();
  const { data, error } = await sb.from("direct_messages")
    .select("id, sender_id, recipient_id, content, created_at, read_at")
    .or(`sender_id.eq.${state.user.id},recipient_id.eq.${state.user.id}`)
    .order("created_at", { ascending:true });
  const thread = (data||[]).filter(m =>
    (m.sender_id===state.user.id && m.recipient_id===partnerId) ||
    (m.sender_id===partnerId && m.recipient_id===state.user.id)
  );
  state.activeConversation.messages = thread;
  render();
  const unread = thread.filter(m=>m.recipient_id===state.user.id && !m.read_at);
  for(const m of unread){
    await sb.from("direct_messages").update({ read_at: new Date().toISOString() }).eq("id", m.id);
  }
  if(unread.length){ await loadConversations(); render(); }
}

async function sendMessage(){
  const input = document.getElementById("dm-input");
  const content = input ? input.value.trim() : "";
  if(!content || !state.activeConversation) return;
  const partnerId = state.activeConversation.partnerId;
  const { data, error } = await sb.from("direct_messages").insert({
    sender_id: state.user.id, recipient_id: partnerId, content
  }).select().single();
  if(error){ showToast("Could not send message: "+error.message); return; }
  state.activeConversation.messages.push(data);
  render();
  await loadConversations();
}

// ---- Realtime: push new messages in instantly, no polling ----
function subscribeToMessages(){
  if(!state.user || typeof sb.channel !== "function") return;
  unsubscribeFromMessages();
  messagesChannel = sb
    .channel("direct-messages-"+state.user.id)
    .on("postgres_changes", {
      event: "INSERT",
      schema: "public",
      table: "direct_messages",
      filter: `recipient_id=eq.${state.user.id}`
    }, (payload) => { handleIncomingMessage(payload.new); })
    .subscribe();
}

function unsubscribeFromMessages(){
  if(messagesChannel){
    try{ sb.removeChannel(messagesChannel); }catch(e){}
    messagesChannel = null;
  }
}

async function handleIncomingMessage(msg){
  const viewingThisThread = state.view === "messages" && state.activeConversation && state.activeConversation.partnerId === msg.sender_id;
  if(viewingThisThread){
    state.activeConversation.messages.push(msg);
    render();
    try{ await sb.from("direct_messages").update({ read_at: new Date().toISOString() }).eq("id", msg.id); }catch(e){}
  }
  await loadConversations();
  render();
}

async function submitReport(targetType, targetId, reason){
  const { error } = await sb.from("reports").insert({ reporter_id: state.user.id, target_type: targetType, target_id: targetId, reason: reason || null });
  if(error){ showToast("Could not submit report: "+error.message); return; }
  showToast("Reported. Thanks for flagging this.");
}

async function loadReports(){
  const { data, error } = await sb.from("reports").select("*").eq("resolved", false).order("created_at", {ascending:false});
  if(error){ state.reports = []; return; }
  const enriched = [];
  for(const r of (data||[])){
    let content = "", authorName = "Unknown";
    if(r.target_type === "post"){
      const { data: post } = await sb.from("posts").select("content, user_id, profiles(display_name)").eq("id", r.target_id).single();
      if(post){ content = post.content || "(photo only, no text)"; authorName = post.profiles ? post.profiles.display_name : "Unknown"; }
      else content = "(this post was already removed)";
    } else {
      const { data: comment } = await sb.from("post_comments").select("content, user_id, profiles(display_name)").eq("id", r.target_id).single();
      if(comment){ content = comment.content; authorName = comment.profiles ? comment.profiles.display_name : "Unknown"; }
      else content = "(this comment was already removed)";
    }
    enriched.push({ id:r.id, targetType:r.target_type, targetId:r.target_id, reason:r.reason, content, authorName, createdAt:r.created_at });
  }
  state.reports = enriched;
}

async function resolveReport(reportId, removeContent){
  const report = state.reports.find(r=>r.id===reportId);
  if(!report) return;
  if(removeContent){
    if(report.targetType === "post"){
      await sb.from("posts").delete().eq("id", report.targetId);
      state.feedPosts = state.feedPosts.filter(p=>p.id!==report.targetId);
    } else {
      await sb.from("post_comments").delete().eq("id", report.targetId);
      state.feedPosts.forEach(p=>{ p.comments = p.comments.filter(c=>c.id!==report.targetId); });
    }
  }
  const { error } = await sb.from("reports").update({ resolved:true }).eq("id", reportId);
  if(error){ showToast("Could not update report: "+error.message); return; }
  state.reports = state.reports.filter(r=>r.id!==reportId);
  render();
}

async function openUserProfile(userId, displayName){
  state.profileReturnView = state.view;
  state.loading = true;
  render();
  const { data, error } = await sb.from("climbs").select("mountain_id, climbed_on").eq("user_id", userId);
  const hiked = new Set(), dates = {};
  if(!error){
    (data||[]).forEach(row => { hiked.add(row.mountain_id); dates[row.mountain_id] = row.climbed_on; });
  }
  const counts = await loadFollowCounts(userId);
  state.viewingProfile = { userId, displayName, hiked, dates, followerCount:counts.followers, followingCount:counts.following };
  state.view = "profile";
  state.loading = false;
  render();
}

function renderProfile(){
  const vp = state.viewingProfile;
  if(!vp) return `<div class="empty">Hiker not found.</div>`;
  const done = MOUNTAINS.filter(m=>vp.hiked.has(m.id)).sort((a,b)=>b.maslNum-a.maslNum);
  const totalElev = done.reduce((s,m)=>s+m.maslNum,0);
  const isMe = vp.userId === state.user.id;
  const streak = computeStreakWeeks(vp.dates);
  return `
  <div class="wall-head">
    <a data-action="back-from-profile" style="font-size:12px; color:var(--gold); cursor:pointer; text-decoration:underline; display:inline-block; margin-bottom:10px;">← Back</a>
    <h3>${esc(vp.displayName)}'s badge wall</h3>
    <p>${done.length} peak${done.length!==1?'s':''} badged · ${totalElev.toLocaleString()} masl climbed total</p>
    <p style="font-size:12.5px; color:var(--canvas-dim); margin:2px 0 0;">${vp.followerCount} follower${vp.followerCount!==1?'s':''} · ${vp.followingCount} following</p>
    ${streak > 0 ? `<p class="streak-line">🔥 ${streak}-week climbing streak</p>` : ``}
    ${!isMe ? `<button class="btn follow-btn" data-action="toggle-follow" data-user="${vp.userId}">${state.following.has(vp.userId) ? "Following ✓" : "Follow"}</button>
    <button class="toggle-btn follow-btn" data-action="message-user" data-user="${vp.userId}" data-name="${esc(vp.displayName)}" style="width:auto; margin-left:8px;">Message</button>` : ``}
  </div>
  ${done.length === 0 ? `<div class="empty">No badges yet.</div>` : `
  <div class="wall-grid">
    ${done.map(m=>`
      <div class="wall-badge">
        ${badgeSVG(m, 84)}
        <div class="wall-name">${esc(m.name)}</div>
        <div class="wall-place">${esc(m.place)}</div>
      </div>
    `).join("")}
  </div>`}`;
}

function buildRidgeSVG(){
  if(MOUNTAINS.length === 0){
    return `<svg viewBox="0 0 900 200" xmlns="http://www.w3.org/2000/svg"></svg>`;
  }
  const sorted = [...MOUNTAINS].sort((a,b)=>b.maslNum-a.maslNum);
  const n = sorted.length;
  const arranged = new Array(n);
  let left = Math.floor((n-1)/2), right = left+1, goLeft = true;
  for(const m of sorted){
    if(goLeft){ arranged[left]=m; left--; } else { arranged[right]=m; right++; }
    goLeft = !goLeft;
  }
  const W = 900, H = 200, base = 190, maxH = 150;
  const maxMasl = sorted[0].maslNum;
  const pts = arranged.map((m,i)=>{
    const x = (i/(n-1))*W;
    const y = base - (m.maslNum/maxMasl)*maxH;
    return {x, y, m};
  });
  const poly = "0,"+base+" " + pts.map(p=>p.x.toFixed(1)+","+p.y.toFixed(1)).join(" ") + " "+W+","+base;
  let flags = "";
  pts.forEach(p=>{
    if(state.hiked.has(p.m.id)){
      flags += `<g transform="translate(${p.x.toFixed(1)},${(p.y-1).toFixed(1)})">
        <line x1="0" y1="0" x2="0" y2="-16" stroke="#f2e9d0" stroke-width="1.2"/>
        <path d="M0,-16 L9,-12.5 L0,-9 Z" fill="#b5502e"/>
      </g>`;
    }
  });
  return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">
    <polygon points="${poly}" fill="#324a2c" stroke="#4a6a3f" stroke-width="1"/>
    ${flags}
  </svg>`;
}

}

function render(){
  if(state.loading){ app.innerHTML = `<div class="wrap"></div>`; return; }
  if(!state.user || !state.profile){ renderAuth(); return; }
  const body = state.view==="log" ? renderLog()
    : state.view==="feed" ? renderFeed()
    : state.view==="wall" ? renderWall()
    : state.view==="profile" ? renderProfile()
    : state.view==="reports" ? renderReportsPanel()
    : state.view==="map" ? renderMapView()
    : state.view==="messages" ? renderMessages()
    : renderRankings();
  app.innerHTML = renderHeader() + body
    + (state.toast ? `<div class="toast">${esc(state.toast)}</div>` : ``)
    + renderModal()
    + renderCelebration()
    + (state.lightboxUrl ? `<div class="photo-lightbox"><img src="${esc(state.lightboxUrl)}"></div>` : ``);
  if(state.view === "map"){
    initMountainMap();
  } else {
    destroyMountainMap();
  }
}

function renderMessages(){
  if(state.activeConversation) return renderConversationThread();
  if(!state.conversations || state.conversations.length === 0){
    return `<div class="empty">No conversations yet. Visit a hiker's profile and click "Message" to start one.</div>`;
  }
  return `<div class="conv-list">
    ${state.conversations.map(c=>`
      <div class="conv-row ${c.unread>0?'unread':''}" data-action="open-conversation" data-user="${c.partnerId}" data-name="${esc(c.partnerName)}">
        <div class="conv-top">
          <div class="conv-name">${esc(c.partnerName)}</div>
          ${c.unread>0 ? `<span class="notif-badge" style="position:static;">${c.unread>9?'9+':c.unread}</span>` : ``}
          <div class="conv-time">${timeAgo(c.lastMessage.created_at)}</div>
        </div>
        <div class="conv-preview">${c.lastMessage.sender_id===state.user.id ? "You: " : ""}${esc((c.lastMessage.content||"").slice(0,70))}</div>
      </div>
    `).join("")}
  </div>`;
}

function renderConversationThread(){
  const conv = state.activeConversation;
  return `
  <a data-action="back-to-conversations" style="font-size:12px; color:var(--gold); cursor:pointer; text-decoration:underline; display:inline-block; margin-bottom:12px;">← Back to messages</a>
  <h3 style="margin-bottom:14px; cursor:pointer; display:inline-block;" data-view-profile="${conv.partnerId}" data-profile-name="${esc(conv.partnerName)}">${esc(conv.partnerName)}</h3>
  <div class="dm-thread">
    ${conv.messages.map(m=>`
      <div class="dm-bubble ${m.sender_id===state.user.id?'mine':'theirs'}">
        <div class="dm-text">${esc(m.content)}</div>
        <div class="dm-time">${timeAgo(m.created_at)}</div>
      </div>
    `).join("") || `<div class="empty">Say hello!</div>`}
  </div>
  <div class="dm-input-row">
    <input type="text" id="dm-input" placeholder="Write a message...">
    <button class="btn" data-action="send-message">Send</button>
  </div>`;
}

function renderMapView(){
  const withCoords = MOUNTAINS.filter(m => m.lat != null && m.lng != null);
  const missing = MOUNTAINS.length - withCoords.length;
  return `
  <h3 style="margin-bottom:4px;">Mountain map</h3>
  <p style="font-size:13px; color:var(--canvas-dim); margin:0 0 4px;">Solid pins are mountains you've badged. Some locations are approximate — edit a mountain to correct its pin.</p>
  ${missing > 0 ? `<p style="font-size:12px; color:var(--canvas-dim); margin:0 0 12px;">${missing} mountain${missing!==1?'s':''} without a saved location aren't shown yet.</p>` : `<div style="margin-bottom:12px;"></div>`}
  <div id="mountain-map" style="height:520px; border-radius:6px; overflow:hidden; border:1px solid rgba(242,233,208,0.15);"></div>
  `;
}

function destroyMountainMap(){
  if(mountainMapInstance){
    try{ mountainMapInstance.remove(); }catch(e){}
    mountainMapInstance = null;
  }
}

function initMountainMap(){
  if(typeof L === "undefined") return;
  const container = document.getElementById("mountain-map");
  if(!container) return;
  destroyMountainMap();

  mountainMapInstance = L.map("mountain-map", { scrollWheelZoom: true }).setView([12.4, 122.0], 6);
  L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png", {
    attribution: "&copy; OpenStreetMap contributors &copy; CARTO",
    maxZoom: 18,
    className: "map-tiles-green"
  }).addTo(mountainMapInstance);

  const withCoords = MOUNTAINS.filter(m => m.lat != null && m.lng != null);
  withCoords.forEach(m=>{
    const c = CAT(m.difficulty);
    const done = state.hiked.has(m.id);
    const marker = L.circleMarker([m.lat, m.lng], {
      radius: done ? 7 : 6,
      color: c.dk,
      weight: done ? 2 : 1,
      fillColor: c.fill,
      fillOpacity: done ? 0.9 : 0.25
    }).addTo(mountainMapInstance);
    marker.bindPopup(`
      <div style="font-family:'Oswald',sans-serif; min-width:150px;">
        <b>${esc(m.name)}</b>${done ? ' <span style="color:#4a7a3a;">✓</span>' : ''}<br>
        <span style="font-size:12px; color:#555;">${esc(m.place)}</span><br>
        <span style="font-family:'JetBrains Mono',monospace; font-size:12px;">${esc(m.maslRaw)} masl</span> ·
        <span style="font-size:11px;">${esc(m.difficulty)}</span>
      </div>
    `);
  });
}


function renderReportsPanel(){
  if(!isAdmin()) return `<div class="empty">Admins only.</div>`;
  if(!state.reports || state.reports.length === 0) return `<div class="empty">No open reports. Nice and quiet.</div>`;
  return `<div class="feed-list">${state.reports.map(r=>`
    <div class="post-card">
      <div class="post-head">
        <div class="post-author">${esc(r.authorName)}</div>
        <div class="post-time">${timeAgo(r.createdAt)}</div>
        <div style="margin-left:auto; font-size:10px; text-transform:uppercase; letter-spacing:0.04em; color:var(--ink-soft);">${esc(r.targetType)}</div>
      </div>
      <p class="post-content">${esc(r.content)}</p>
      ${r.reason ? `<p style="font-size:12px; color:var(--ink-soft); font-style:italic; margin:-4px 0 10px;">Reason given: ${esc(r.reason)}</p>` : ``}
      <div class="post-actions">
        <button class="btn" data-action="resolve-report-remove" data-report="${r.id}" style="font-size:11px; padding:7px 14px;">Remove & resolve</button>
        <button class="toggle-btn" data-action="resolve-report-dismiss" data-report="${r.id}" style="width:auto; font-size:11px; padding:7px 14px; margin-top:0;">Dismiss</button>
      </div>
    </div>
  `).join("")}</div>`;
}

function renderAuth(){
  const mode = state.authMode;

  if(mode === "update-password"){
    app.innerHTML = `
    <div class="onboard">
      <h2>Set a new password</h2>
      <p>You followed a password reset link. Choose a new password below.</p>
      <div>
        <input type="password" id="auth-new-password" placeholder="New password" autocomplete="new-password">
        ${state.authError ? `<p style="color:var(--rust); font-size:12.5px; margin:-6px 0 12px;">${esc(state.authError)}</p>` : ``}
        <button type="button" data-action="submit-new-password" ${state.authLoading ? "disabled" : ""}>${state.authLoading ? "Please wait…" : "Save new password"}</button>
      </div>
    </div>`;
    return;
  }

  if(mode === "reset"){
    app.innerHTML = `
    <div class="onboard">
      <h2>Reset your password</h2>
      <p>Enter the email you signed up with — we'll send a link to set a new password.</p>
      <div>
        <input type="email" id="auth-email" placeholder="Email" autocomplete="email">
        ${state.authError ? `<p style="color:var(--rust); font-size:12.5px; margin:-6px 0 12px;">${esc(state.authError)}</p>` : ``}
        <button type="button" data-action="submit-reset" ${state.authLoading ? "disabled" : ""}>${state.authLoading ? "Please wait…" : "Send reset link"}</button>
      </div>
      <p class="fine"><a data-action="switch-auth-mode" data-mode="signin" style="color:var(--rust); cursor:pointer; text-decoration:underline;">Back to sign in</a></p>
    </div>`;
    return;
  }

  const isSignup = mode === "signup";
  app.innerHTML = `
  <div class="onboard">
    <h2>Summit Log</h2>
    <p>Track the Philippine mountains you've climbed, earn a badge for each one, and see how you stack up against other hikers.</p>
    <div>
      ${isSignup ? `<input type="text" id="auth-display-name" placeholder="Your trail name (shown publicly)" maxlength="24">` : ``}
      <input type="email" id="auth-email" placeholder="Email" autocomplete="email">
      <input type="password" id="auth-password" placeholder="Password" autocomplete="${isSignup ? 'new-password' : 'current-password'}">
      ${state.authError ? `<p style="color:var(--rust); font-size:12.5px; margin:-6px 0 12px;">${esc(state.authError)}</p>` : ``}
      <button type="button" data-action="submit-auth" ${state.authLoading ? "disabled" : ""}>${state.authLoading ? "Please wait…" : (isSignup ? "Create account" : "Sign in")}</button>
    </div>
    <p class="fine">
      ${isSignup ? `Already have an account? <a data-action="switch-auth-mode" data-mode="signin" style="color:var(--rust); cursor:pointer; text-decoration:underline;">Sign in</a>`
                 : `New here? <a data-action="switch-auth-mode" data-mode="signup" style="color:var(--rust); cursor:pointer; text-decoration:underline;">Create an account</a>
                    &nbsp;·&nbsp; <a data-action="switch-auth-mode" data-mode="reset" style="color:var(--rust); cursor:pointer; text-decoration:underline;">Forgot password?</a>`}
    </p>
    <p class="fine">Your trail name and climb count appear on the public rankings, visible to anyone signed in to this site.</p>
  </div>`;
}

const REGION_MAP = [
  ["Luzon", ["benguet","nueva vizcaya","ifugao","kalinga","mountain province","cagayan","zambales","tarlac","pampanga","bulacan","rizal","laguna","batangas","cavite","quezon","bataan","camarines","albay","sorsogon","mindoro","palawan","bicol"]],
  ["Visayas", ["cebu","negros","iloilo","antique","aklan","capiz","leyte","samar","siquijor","bohol","romblon"]],
  ["Mindanao", ["davao","cotabato","bukidnon","zamboanga","misamis","agusan","surigao","camiguin","lanao","maguindanao","sarangani","sultan kudarat"]]
];
function inferRegion(place){
  const p = String(place).toLowerCase();
  for(const [region, keys] of REGION_MAP){
    if(keys.some(k=>p.includes(k))) return region;
  }
  return "Other";
}

function getFiltered(){
  const q = state.search.trim().toLowerCase();
  let list = MOUNTAINS.slice();
  if(state.region !== "all") list = list.filter(m => inferRegion(m.place) === state.region);
  if(state.status === "hiked") list = list.filter(m => state.hiked.has(m.id));
  else if(state.status === "not-yet") list = list.filter(m => !state.hiked.has(m.id));
  if(q) list = list.filter(m => m.name.toLowerCase().includes(q) || m.place.toLowerCase().includes(q));
  return list;
}

const PAGE_SIZE = 12;

function renderLog(){
  const filtered = getFiltered();
  let body = "";
  if(filtered.length === 0){
    const msg = state.search.trim() ? `No mountains match "${esc(state.search)}".`
      : state.status === "hiked" ? "You haven't badged any mountains in this region yet."
      : state.status === "not-yet" ? "Nothing left here — you've badged every mountain matching these filters."
      : "No mountains match these filters.";
    body = `<div class="no-results">${msg}</div>`;
  } else if(state.sort === "groups"){
    const groups = {};
    filtered.forEach(m=>{
      const cat = CAT(m.difficulty).label;
      (groups[cat] = groups[cat]||[]).push(m);
    });
    const isSearching = state.search.trim().length > 0;
    const presentCats = GROUP_ORDER.filter(cat=>groups[cat]);
    const allExpanded = presentCats.length > 0 && presentCats.every(cat=>state.expandedGroups.has(cat));
    body += `<div class="expand-all-row"><a data-action="toggle-expand-all">${allExpanded ? "Collapse all" : "Expand all"}</a></div>`;
    presentCats.forEach(cat=>{
      const list = groups[cat];
      list.sort((a,b)=>b.maslNum-a.maslNum);
      const c = CAT(cat);
      const doneInGroup = list.filter(m=>state.hiked.has(m.id)).length;
      const expanded = isSearching || state.expandedGroups.has(cat);
      const visibleCount = state.visibleCounts["group:"+cat] || PAGE_SIZE;
      const visibleList = list.slice(0, visibleCount);
      const remaining = list.length - visibleList.length;
      body += `<div class="group">
        <div class="group-head" data-action="toggle-group" data-group="${esc(cat)}">
          <span class="swatch" style="background:${c.fill}"></span>
          <h3>${cat}</h3>
          <span class="count">${doneInGroup}/${list.length} badged</span>
          <span class="group-chevron">${expanded ? "▲" : "▼"}</span>
        </div>
        ${expanded ? `
          <div class="grid">
            ${visibleList.map(m=>cardHTML(m)).join("")}
          </div>
          ${remaining > 0 ? `<button class="btn load-more-btn" data-action="load-more-group" data-group="${esc(cat)}">Show ${Math.min(PAGE_SIZE, remaining)} more (${remaining} left)</button>` : ``}
        ` : ``}
      </div>`;
    });
  } else {
    const list = filtered.slice();
    if(state.sort === "elev-desc") list.sort((a,b)=>b.maslNum-a.maslNum);
    else if(state.sort === "elev-asc") list.sort((a,b)=>a.maslNum-b.maslNum);
    else if(state.sort === "name-asc") list.sort((a,b)=>a.name.localeCompare(b.name));
    const visibleCount = state.visibleCounts["flat"] || PAGE_SIZE;
    const visibleList = list.slice(0, visibleCount);
    const remaining = list.length - visibleList.length;
    body = `<div class="grid">${visibleList.map(m=>cardHTML(m)).join("")}</div>
      ${remaining > 0 ? `<button class="btn load-more-btn" data-action="load-more-flat">Show ${Math.min(PAGE_SIZE, remaining)} more (${remaining} left)</button>` : ``}`;
  }
  return renderControls() + renderAddMountainSection() + body;
}

function cardHTML(m){
  if(state.editingId === m.id) return editCardHTML(m);
  const c = CAT(m.difficulty);
  const done = state.hiked.has(m.id);
  const dateStr = state.hikedDates[m.id];
  const notesStr = state.hikedNotes[m.id];
  const photoUrl = state.hikedPhotos[m.id];
  const canEdit = canEditMountain(m);
  return `<div class="card ${done?'done':''}">
    ${done ? `<div class="stamp">Summited</div>` : ``}
    <div class="card-top">
      ${badgeSVG(m)}
      ${canEdit ? `<a class="edit-link" data-edit="${m.id}">Edit</a>` : ``}
    </div>
    <p class="card-name">${esc(m.name)}</p>
    <p class="card-place">${esc(m.place)}</p>
    <div class="card-bottom">
      <div class="masl">${m.maslRaw}<small> masl</small></div>
      <div class="diff-pill" style="background:${c.dk}; color:${c.fill}">${esc(m.difficulty)}</div>
    </div>
    <button class="toggle-btn" data-toggle="${m.id}">${done ? "Badge earned ✓" : "Mark as hiked"}</button>
    ${done ? `<div class="climb-date">${dateStr ? esc(formatDate(dateStr)) : "No date logged"} · <a data-edit-date="${m.id}">${dateStr ? "edit" : "add date"}</a></div>` : ``}
    ${done && (notesStr || photoUrl) ? `<div class="climb-meta">

const REGION_ORDER = ["Luzon","Visayas","Mindanao","Other"];
const REGION_COLOR = {Luzon:"var(--moss)", Visayas:"var(--teal)", Mindanao:"var(--rust)", Other:"var(--thread)"};

function computeStats(){
  const done = MOUNTAINS.filter(m=>state.hiked.has(m.id));
  const byRegion = {}, byDiff = {};
  done.forEach(m=>{
    const r = inferRegion(m.place);
    byRegion[r] = byRegion[r] || {count:0, elev:0};
    byRegion[r].count++; byRegion[r].elev += m.maslNum;
    const cat = CAT(m.difficulty).label;
    byDiff[cat] = byDiff[cat] || {count:0, elev:0};
    byDiff[cat].count++; byDiff[cat].elev += m.maslNum;
  });
  return {byRegion, byDiff};
}

function renderBarRows(dataObj, orderList, colorFn){
  const entries = orderList.filter(k=>dataObj[k]).map(k=>({key:k, ...dataObj[k]}));
  if(entries.length === 0) return `<p style="font-size:12px; color:var(--canvas-dim);">Nothing here yet.</p>`;
  const maxElev = Math.max(...entries.map(e=>e.elev), 1);
  return entries.map(e=>{
    const pct = Math.max(6, Math.round((e.elev/maxElev)*100));
    return `<div class="stat-row">
      <div class="stat-label">${esc(e.key)}</div>
      <div class="stat-bar-track"><div class="stat-bar-fill" style="width:${pct}%; background:${colorFn(e.key)};"></div></div>
      <div class="stat-value mono">${e.count} pk · ${e.elev.toLocaleString()} m</div>
    </div>`;
  }).join("");
}

function renderStats(){
  const {byRegion, byDiff} = computeStats();
  return `
  <h3 style="margin:30px 0 4px;">My climbing breakdown</h3>
  <p style="font-size:13px; color:var(--canvas-dim); margin:0 0 4px;">Elevation climbed, by region and by difficulty.</p>
  <div class="stats-grid">
    <div class="stats-col">
      <h4>By region</h4>
      ${renderBarRows(byRegion, REGION_ORDER, k=>REGION_COLOR[k]||"var(--thread)")}
    </div>
    <div class="stats-col">
      <h4>By difficulty</h4>
      ${renderBarRows(byDiff, GROUP_ORDER, k=>CAT(k).fill)}
    </div>
  </div>`;
}

  const replies = post.comments.filter(r=>r.parentId===comment.id);

  return `<div class="comment-row">

  return `<div class="post-photos ${countClass}">
    ${shown.map((url,i)=>`
      <div class="post-photo-item-wrap">
        <img class="post-photo-item" src="${esc(url)}" data-view-photo="${esc(url)}">
        ${(i===shown.length-1 && extra>0) ? `<div class="post-photo-more" data-view-photo="${esc(url)}">+${extra}</div>` : ``}
      </div>
    `).join("")}
  </div>`;
}

function renderWall(){
  const done = MOUNTAINS.filter(m=>state.hiked.has(m.id)).sort((a,b)=>b.maslNum-a.maslNum);
  if(done.length === 0){
    return `<div class="empty">Your board is empty. Mark a mountain as hiked on the Trail log to add your first patch.</div>`;
  }
  const totalElev = done.reduce((s,m)=>s+m.maslNum,0);
  const streak = computeStreakWeeks(state.hikedDates);
  const timelineSorted = done.slice().sort((a,b)=>{
    const da = state.hikedDates[a.id], db = state.hikedDates[b.id];
    if(da && db) return db.localeCompare(da);
    if(da && !db) return -1;
    if(!da && db) return 1;
    return a.name.localeCompare(b.name);
  });
  return `
  <div class="wall-head">
    <h3>My badge wall</h3>
    <p>${done.length} peak${done.length!==1?'s':''} badged · ${totalElev.toLocaleString()} masl climbed total</p>
    ${streak > 0 ? `<p class="streak-line">🔥 ${streak}-week climbing streak</p>` : ``}
    <div class="wall-actions">
      <button class="btn" data-action="copy-summary">Copy my summary</button>
      <button class="toggle-btn" data-action="download-wall">Download as image</button>
    </div>
  </div>
  <div class="wall-grid">
    ${done.map(m=>`
      <div class="wall-badge">
        ${badgeSVG(m, 84)}
        <div class="wall-name">${esc(m.name)}</div>
        <div class="wall-place">${esc(m.place)}</div>
      </div>
    `).join("")}
  </div>
  ${renderStats()}
  <h3 style="margin:30px 0 4px;">Climb timeline</h3>
  <p style="font-size:13px; color:var(--canvas-dim); margin:0 0 4px;">Most recent climbs first. Add dates on any card to fill this in.</p>
  <div class="timeline">
    ${timelineSorted.map(m=>{
      const c = CAT(m.difficulty);
      const d = state.hikedDates[m.id];

      const notesStr = state.hikedNotes[m.id];
      return `<div class="timeline-row">
        <div class="timeline-dot" style="background:${c.fill}"></div>
        <div class="timeline-date">${d ? esc(formatDate(d)) : "No date"} <a data-edit-date="${m.id}" style="font-size:10px; margin-left:2px;">edit</a></div>
        <div class="timeline-name">${photoUrl ? `<img class="climb-photo-thumb" style="width:20px; height:20px; vertical-align:middle; margin-right:6px;" src="${esc(photoUrl)}" data-view-photo="${esc(photoUrl)}">` : ``}${esc(m.name)}</div>
        <div class="timeline-place">${esc(m.place)}${notesStr ? `<br><span style="font-style:italic; opacity:0.8;">${esc(notesStr)}</span>` : ``}</div>
      </div>`;
    }).join("")}
